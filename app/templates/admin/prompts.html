<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프롬프트 편집기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; overflow-y: auto; }
        #sidebar h2 { margin-bottom: 20px; font-size: 18px; }
        .prompt-item { padding: 10px; margin: 5px 0; background: #34495e; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        .prompt-item:hover { background: #3d566e; }
        .prompt-item.active { background: #3498db; }
        #main { flex: 1; display: flex; flex-direction: column; }
        #header { background: #ecf0f1; padding: 15px 20px; border-bottom: 1px solid #bdc3c7; display: flex; justify-content: space-between; align-items: center; }
        #header h1 { font-size: 20px; }
        #buttons { display: flex; gap: 10px; align-items: center; }
        #editor { flex: 1; padding: 20px; overflow-y: auto; }
        textarea { width: 100%; height: 100%; border: 1px solid #ddd; border-radius: 5px; padding: 15px; font-family: 'Courier New', monospace; font-size: 14px; resize: none; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        #saveBtn { background: #27ae60; color: white; }
        #saveBtn:hover { background: #229954; }
        #restoreBtn { background: #3498db; color: white; }
        #restoreBtn:hover { background: #2980b9; }
        #backupsBtn { background: #95a5a6; color: white; }
        #backupsBtn:hover { background: #7f8c8d; }
        .message { margin-left: 15px; font-size: 14px; color: #27ae60; }
        #backupModal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        #backupContent { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; width: 80%; max-width: 800px; max-height: 80%; overflow-y: auto; }
        .backup-item { padding: 10px; margin: 5px 0; background: #f3f4f6; border-radius: 5px; cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .backup-item:hover { background: #e5e7eb; }
        .backup-name { flex: 1; }
        .backup-actions { display: flex; gap: 5px; }
        .backup-actions button { padding: 5px 10px; font-size: 12px; border: none; border-radius: 3px; cursor: pointer; }
        .btn-rename { background: #3498db; color: white; }
        .btn-rename:hover { background: #2980b9; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-delete:hover { background: #c0392b; }
        #closeModal { float: right; cursor: pointer; font-size: 24px; color: #7f8c8d; }
        #closeModal:hover { color: #34495e; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>프롬프트 파일</h2>
        <div id="promptList"></div>
    </div>
    <div id="main">
        <div id="header">
            <h1 id="currentPrompt">프롬프트를 선택하세요</h1>
            <div id="buttons">
                <button id="saveBtn" style="display:none;">저장</button>
                <button id="restoreBtn" style="display:none;">원본 복원</button>
                <button id="backupsBtn" style="display:none;">백업 목록</button>
                <span class="message" id="message"></span>
            </div>
        </div>
        <div id="editor">
            <textarea id="content" placeholder="프롬프트를 선택하면 내용이 표시됩니다"></textarea>
        </div>
    </div>

    <div id="backupModal">
        <div id="backupContent">
            <span id="closeModal">&times;</span>
            <h2 style="margin-bottom: 20px;">백업 목록</h2>
            <div id="backupList"></div>
        </div>
    </div>

    <script>
        let currentPrompt = null;
        let originalContent = '';
        const initialFile = '{{ initial_file }}';

        async function loadPrompts() {
            const res = await fetch('/api/prompts');
            const prompts = await res.json();
            const list = document.getElementById('promptList');
            list.innerHTML = prompts.map(name => 
                `<div class="prompt-item" data-name="${name}">${name}</div>`
            ).join('');
            
            document.querySelectorAll('.prompt-item').forEach(item => {
                item.addEventListener('click', () => loadPrompt(item.dataset.name));
            });
            
            // URL 파라미터로 파일 지정된 경우 자동 로드
            if (initialFile && prompts.includes(initialFile)) {
                loadPrompt(initialFile);
            }
        }

        async function loadPrompt(name) {
            const res = await fetch(`/api/prompts/${name}`);
            const data = await res.json();
            
            currentPrompt = name;
            originalContent = data.content;
            document.getElementById('content').value = data.content;
            document.getElementById('currentPrompt').textContent = name;
            document.getElementById('saveBtn').style.display = 'inline-block';
            document.getElementById('restoreBtn').style.display = 'inline-block';
            document.getElementById('backupsBtn').style.display = 'inline-block';
            
            document.querySelectorAll('.prompt-item').forEach(item => {
                item.classList.toggle('active', item.dataset.name === name);
            });
        }

        async function savePrompt() {
            const content = document.getElementById('content').value;
            const res = await fetch(`/api/prompts/${currentPrompt}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            
            const result = await res.json();
            if (result.success) {
                showMessage('저장 완료! (백업: ' + result.backup + ')');
                originalContent = content;
            } else {
                showMessage('❌ 저장 실패: ' + result.error, true);
            }
        }

        async function restoreOriginal() {
            if (!confirm('원본 프롬프트로 복원하시겠습니까? (현재 내용은 백업됩니다)')) return;
            
            const res = await fetch(`/api/prompts/${currentPrompt}/restore`, {
                method: 'POST'
            });
            
            const result = await res.json();
            if (result.success) {
                showMessage('✅ 원본으로 복원되었습니다');
                loadPrompt(currentPrompt);  // 리로드
            } else {
                showMessage('❌ 복원 실패: ' + result.error, true);
            }
        }

        async function showBackups() {
            const res = await fetch(`/api/prompts/${currentPrompt}/backups`);
            const result = await res.json();
            
            if (result.backups && result.backups.length > 0) {
                const list = document.getElementById('backupList');
                list.innerHTML = result.backups.map(backup => `
                    <div class="backup-item">
                        <div class="backup-name" onclick="loadBackup('${backup}')"> ${backup}</div>
                        <div class="backup-actions">
                            <button class="btn-rename" onclick="event.stopPropagation(); renameBackup('${backup}')">이름변경</button>
                            <button class="btn-delete" onclick="event.stopPropagation(); deleteBackup('${backup}')">삭제</button>
                        </div>
                    </div>
                `).join('');
                document.getElementById('backupModal').style.display = 'block';
            } else {
                showMessage('백업 파일이 없습니다');
            }
        }

        async function loadBackup(backupFile) {
            const res = await fetch(`/api/prompts/${currentPrompt}/backups/${backupFile}`);
            const result = await res.json();
            
            if (result.content) {
                if (confirm(`백업 "${backupFile}"을(를) 불러오시겠습니까?`)) {
                    document.getElementById('content').value = result.content;
                    document.getElementById('backupModal').style.display = 'none';
                    showMessage('백업을 불러왔습니다 (저장 버튼을 눌러 적용하세요)');
                }
            }
        }

        async function deleteBackup(backupFile) {
            if (!confirm(`백업 "${backupFile}"을(를) 삭제하시겠습니까?`)) return;
            
            const res = await fetch(`/api/prompts/${currentPrompt}/backups/${backupFile}`, {
                method: 'DELETE'
            });
            
            const result = await res.json();
            if (result.success) {
                showMessage('백업이 삭제되었습니다');
                showBackups();  // 목록 새로고침
            } else {
                showMessage('❌ 삭제 실패: ' + result.error, true);
            }
        }

        async function renameBackup(backupFile) {
            const newName = prompt('새 파일명을 입력하세요:', backupFile.replace('.backup', ''));
            if (!newName || newName.trim() === '') return;
            
            const res = await fetch(`/api/prompts/${currentPrompt}/backups/${backupFile}/rename`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_name: newName })
            });
            
            const result = await res.json();
            if (result.success) {
                showMessage(`파일명이 "${result.new_name}"로 변경되었습니다`);
                showBackups();  // 목록 새로고침
            } else {
                showMessage('❌ 변경 실패: ' + result.error, true);
            }
        }

        function closeBackupModal() {
            document.getElementById('backupModal').style.display = 'none';
        }

        function resetPrompt() {
            if (confirm('마지막 저장 상태로 되돌리시겠습니까?')) {
                document.getElementById('content').value = originalContent;
                showMessage('마지막 저장 상태로 복원됨');
            }
        }

        function showMessage(msg, isError = false) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.style.color = isError ? '#e74c3c' : '#27ae60';
            setTimeout(() => el.textContent = '', 5000);
        }

        document.getElementById('saveBtn').addEventListener('click', savePrompt);
        document.getElementById('restoreBtn').addEventListener('click', restoreOriginal);
        document.getElementById('backupsBtn').addEventListener('click', showBackups);
        document.getElementById('closeModal').addEventListener('click', closeBackupModal);
        
        // 모달 외부 클릭 시 닫기
        document.getElementById('backupModal').addEventListener('click', (e) => {
            if (e.target.id === 'backupModal') closeBackupModal();
        });
        
        loadPrompts();
    </script>
</body>
</html>
