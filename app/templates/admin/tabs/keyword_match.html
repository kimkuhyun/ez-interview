<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>키워드 설정 및 지원자 매칭</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/keyword_match.css') }}">
</head>
<body>
  <div class="keyword-match-container">
    <!-- 상단: 키워드 관리 영역 -->
    <div class="keyword-section">
      <div class="section-header">
        <h2 id="positionTitle">포지션 키워드 설정</h2>
        <button onclick="closeKeywordView()" class="btn-close">← 목록으로</button>
      </div>
      
      <div class="keyword-manager">
        <div class="keyword-input-group">
          <input type="text" id="keywordInput" placeholder="키워드 입력 (예: React, Python)" onkeypress="if(event.key==='Enter') addKeyword()">
          <button onclick="addKeyword()" class="btn-add-kw">추가</button>
          <button onclick="recommendKeywords()" class="btn-recommend">AI 추천</button>
        </div>
        
        <div class="keywords-display" id="keywordsDisplay">
          <span class="empty-text">키워드를 추가하거나 AI 추천을 받아보세요</span>
        </div>
        
        <button onclick="startMatching()" class="btn-match" id="matchBtn">✓ 지원자 매칭 시작</button>
      </div>
    </div>

    <!-- 하단: 매칭된 지원자 리스트 -->
    <div class="candidates-section">
      <div class="section-header">
        <h3>매칭된 지원자 목록</h3>
        <span class="candidate-count" id="candidateCount">0명</span>
      </div>
      
      <div class="candidates-list" id="candidatesList">
        <div class="empty-state">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <p>키워드를 설정하고 매칭을 시작하세요</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 지원자 상세 모달 -->
  <div id="candidateModal" class="modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="modalCandidateName">지원자 이름</h3>
        <button onclick="closeCandidateModal()" class="btn-modal-close">×</button>
      </div>
      
      <div class="modal-body">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('resume')">📄 이력서</button>
          <button class="tab-btn" onclick="switchTab('portfolio')" id="portfolioTab" style="display:none;">📁 포트폴리오</button>
        </div>
        
        <div class="tab-content">
          <div id="resumeContent" class="document-viewer active">
            <iframe id="resumeFrame" style="width:100%;height:600px;border:1px solid #e2e8f0;border-radius:8px;"></iframe>
          </div>
          <div id="portfolioContent" class="document-viewer">
            <iframe id="portfolioFrame" style="width:100%;height:600px;border:1px solid #e2e8f0;border-radius:8px;"></iframe>
          </div>
        </div>
        
        <div class="modal-actions">
          <button onclick="updateCandidateStatus('interview_pending')" class="btn-pass">✓ 합격</button>
          <button onclick="updateCandidateStatus('rejected')" class="btn-reject">× 불합격</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/keyword_match.js') }}"></script>
</body>
</html>
