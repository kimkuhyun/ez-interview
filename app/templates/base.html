<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 인터뷰 시뮬레이터</title>
    
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Chart.js for radar charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/style.css">
    
    <!-- Meta tags -->
    <meta name="description" content="AI 기반 면접 시뮬레이션 및 피드백 시스템">
    <meta name="theme-color" content="#f3f4f6">
</head>

<body class="bg-gray-100 font-sans antialiased">
    <!-- Main container -->
    <div class="flex h-screen">
        <!-- Left panel -->
        <div id="left" class="w-1/2 p-6 overflow-y-auto bg-gray-50 border-r border-gray-200">
            {% block left %}{% endblock %}
        </div>
        
        <!-- Right panel -->
        <div id="right" class="w-1/2 p-6 overflow-y-auto bg-gray-50">
            {% block right %}{% endblock %}
        </div>
    </div>

    <!-- Preview zoom functionality -->
    <script>
        class PreviewZoom {
            constructor(root) {
                if (!root) return;
                
                this.stage = root.querySelector('[data-stage]');
                this.label = root.querySelector('[data-zoom-label]');
                this.btnIn = root.querySelector('[data-zoom-button="in"]');
                this.btnOut = root.querySelector('[data-zoom-button="out"]');
                this.widthTarget = root.querySelector('[data-zoom-target="width"]');
                this.transformTarget = root.querySelector('[data-zoom-target="transform"]');
                
                this.zoom = parseFloat(this.stage?.dataset.zoom || '1');
                this.init();
            }

            init() {
                this.apply();
                this.bindEvents();
            }

            apply() {
                if (this.label) {
                    this.label.textContent = `${Math.round(this.zoom * 100)}%`;
                }
                if (this.widthTarget) {
                    this.widthTarget.style.width = `${100 * this.zoom}%`;
                }
                if (this.transformTarget) {
                    this.transformTarget.style.transform = `scale(${this.zoom})`;
                    this.transformTarget.style.transformOrigin = '0 0';
                }
                if (this.stage) {
                    this.stage.dataset.zoom = String(this.zoom);
                }
            }

            bindEvents() {
                if (this.btnIn) {
                    this.btnIn.addEventListener('click', () => {
                        this.zoom = Math.min(3.5, Number((this.zoom + 0.1).toFixed(2)));
                        this.apply();
                    });
                }
                
                if (this.btnOut) {
                    this.btnOut.addEventListener('click', () => {
                        this.zoom = Math.max(0.6, Number((this.zoom - 0.1).toFixed(2)));
                        this.apply();
                    });
                }
            }
        }

        function initPreviews() {
            document.querySelectorAll('[data-preview-root]')
                .forEach(root => new PreviewZoom(root));
        }

        // Initialize on page load and after HTMX updates
        document.addEventListener('DOMContentLoaded', initPreviews);
        htmx.on('htmx:afterSwap', initPreviews);
        htmx.on('htmx:oobAfterSwap', initPreviews);
    </script>
</body>
</html>
