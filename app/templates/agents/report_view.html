<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>면접 리포트</title>
  <style>{% include 'css/report.css' %}</style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;z-index:9999;}
    .loading-spinner{width:50px;height:50px;border:4px solid #e5e7eb;border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-text{margin-top:1rem;font-size:14px;color:#374151;max-width:720px;text-align:center;font-weight:500;}
    .slot-wrapper{margin-top:1rem;max-height:20rem;overflow-y:auto;padding:0;max-width:720px;width:100%;text-align:center;}
    .agent-log-item{padding:0.75rem 0;font-size:0.875rem;color:#1f2937;line-height:1.6;opacity:0.85;text-align:left;}
    .debate-container{display:none;}
  </style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div style="max-width:900px;width:90%;background:white;border-radius:1rem;box-shadow:0 10px 40px rgba(0,0,0,0.15);padding:2rem;text-align:center;display:flex;flex-direction:column;align-items:center;">
    <div class="loading-spinner" style="margin:0 auto 1rem;"></div>
    <div class="loading-text">리포트 생성 중...</div>
    <div class="slot-wrapper"><span id="slotText">시작 준비 중...</span></div>
    <div id="debateLog" class="debate-container" style="display:none;"><div id="debateContent"></div></div>
  </div>
</div>

<div class="container">
  <div class="header">
    <div><h1 id="reportTitle">면접 리포트</h1><p>AI 기반 면접 평가 및 분석 결과</p></div>
    <div class="header-actions">
      <button id="dlBtn" class="btn btn-success no-print">HTML 다운로드</button>
      <button id="pdfBtn" class="btn btn-secondary no-print" style="margin-left:0.5rem;">PDF 다운로드</button>
    </div>
  </div>
  <div class="header-line"></div>
  <div id="errBox" class="alert" style="display:none;"></div>

  <div id="reportRoot">
    <div class="headline">
      <div style="display:flex;justify-content:space-between;gap:1rem;">
        <div style="flex:1;"><div id="headlineSummary" class="headline-summary"></div><div id="headlineKeywords" class="headline-keywords"></div></div>
        <div id="reliabilityScores" class="reliability-scores" style="display:none;">
          <div class="reliability-item"><div class="reliability-label">모순 정도</div><div id="contradictionScore" class="reliability-value">-</div></div>
          <div class="reliability-item"><div class="reliability-label">대화 깊이</div><div id="depthScore" class="reliability-value">-</div></div>
          <div class="reliability-item"><div class="reliability-label">신뢰도</div><div id="reliabilityScore" class="reliability-value">-</div></div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card card-indigo card-highlight"><div class="card-header">핵심 평가</div><div class="chart-container"><canvas id="radarChart"></canvas></div></div>
      <div class="card card-emerald card-highlight"><div class="card-header">인터뷰 요약</div><div id="flowList" class="summary-scroll"></div></div>
    </div>

    <div class="grid-2">
      <div class="card" style="border-color:#22d3ee"><div class="card-header">긍정 의견</div><div id="posBox" class="prose"></div></div>
      <div class="card" style="border-color:#fb7185"><div class="card-header">부정 의견</div><div id="negBox" class="prose"></div></div>
    </div>

    <div class="card"><div class="card-header" style="color:#7c3aed;">핵심역량</div><table id="jdTable"><thead><tr><th>역량</th><th>요구사항/기대치</th><th>점수</th><th>근거</th></tr></thead><tbody></tbody></table></div>
    <div class="card"><div class="card-header" style="color:#d97706;">증거 맵</div><table id="evTable"><thead><tr><th>EID</th><th>출처</th><th>내용</th><th>연결</th></tr></thead><tbody></tbody></table></div>
    <div class="card"><div class="card-header" style="color:#0891b2;">대화 통계</div><div id="stats" class="stats"></div></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let radar,currentReportData=null;

function showError(err){
  const box=$("errBox");
  box.innerHTML=`<div class="alert-title">리포트 로드 실패</div><div class="alert-body"><span class="code">${esc(err.code||'ERROR')}</span> ${esc(err.message||'오류')}</div>`;
  box.style.display="block";
  if($("loadingOverlay"))$("loadingOverlay").style.display="none";
}

function addAgentMessage(agent,message){
  const el=$('slotText');
  if(!el)return;
  const div=document.createElement('div');
  div.className='agent-log-item';
  if(message.startsWith('→')){
    div.style.fontWeight='700';
    div.style.marginTop='0.5rem';
    div.style.color='#000000';
  }
  div.textContent=message;
  el.appendChild(div);
  const wrapper=document.querySelector('.slot-wrapper');
  if(wrapper)wrapper.scrollTop=wrapper.scrollHeight;
}

function showDebateLog(topic,logs){
  const debateLog=$("debateLog"),debateContent=$("debateContent");
  if(!debateLog||!debateContent||!logs||!logs.length)return;
  debateLog.style.display="block";
  const section=document.createElement("div");
  section.className="debate-section";
  const h=document.createElement("div");
  h.className="debate-topic";
  h.textContent=topic||"에이전트 토론";
  section.appendChild(h);
  logs.forEach(log=>{
    const d=document.createElement("div");
    d.className="debate-content";
    d.textContent="• "+log;
    section.appendChild(d);
  });
  debateContent.appendChild(section);
  debateLog.scrollTop=debateLog.scrollHeight;
}

function renderReport(r){
  if($("reportRoot"))$("reportRoot").style.display="block";
  if($("dlBtn"))$("dlBtn").style.display="inline-block";
  const title=$("reportTitle");
  if(title)title.textContent=`${r?.metadata?.candidate_name||"지원자"}의 면접 리포트`;
  const hs=$("headlineSummary");
  if(hs)hs.textContent=r?.headline?.oneline_summary||"";
  const hk=$("headlineKeywords");
  if(hk){
    const tags=Array.isArray(r?.headline?.tag)?r.headline.tag:[];
    hk.innerHTML=tags.map(t=>`<span class="headline-keyword">#${esc(t)}</span>`).join('');
  }
  if(r?.quality){
    const rs=$("reliabilityScores");
    if(rs)rs.style.display="flex";
    const q=r.quality;
    const cs=$("contradictionScore"),ds=$("depthScore"),rls=$("reliabilityScore");
    if(cs&&q.contradiction_score!==undefined){
      cs.textContent=`${q.contradiction_score}%`;
      cs.style.color=q.contradiction_score>50?"#dc2626":q.contradiction_score>30?"#f59e0b":"#10b981";
    }
    if(ds&&q.depth_score!==undefined){
      ds.textContent=`${q.depth_score}%`;
      ds.style.color=q.depth_score>70?"#10b981":q.depth_score>50?"#f59e0b":"#dc2626";
    }
    if(rls&&q.reliabality_score!==undefined){
      rls.textContent=`${q.reliabality_score}%`;
      rls.style.color=q.reliabality_score>70?"#10b981":q.reliabality_score>50?"#f59e0b":"#dc2626";
    }
  }
  const axes=r.axes||[],labels=axes.map(a=>a.competency||a.label||""),values=axes.map(a=>a.score||0);
  const rc=$("radarChart");
  if(rc){
    if(radar)radar.destroy();
    radar=new Chart(rc,{type:'radar',data:{labels,datasets:[{label:'점수',data:values,fill:true,backgroundColor:'rgba(99,102,241,0.2)',borderColor:'rgb(79,70,229)',borderWidth:2,pointBackgroundColor:'rgb(79,70,229)',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:true,scales:{r:{beginAtZero:true,min:0,max:100,ticks:{stepSize:20}}},plugins:{legend:{display:false}}}});
  }
  const items=(r.interview_summary?.items)||[];
  const flowList=$("flowList");
  if(flowList){
    flowList.innerHTML=items.map(it=>`<div class="qa-simple"><div class="qa-topic">${esc(it.questions||"")}</div><div class="qa-summary">${esc(it.answers||"")}</div></div>`).join("")||'<div class="empty"><p>요약 없음</p></div>';
  }
  const posBox=$("posBox"),negBox=$("negBox");
  if(posBox)posBox.innerHTML=`<p>${esc(r?.interview_commentary?.positive_comment||"")}</p>`||'<div class="empty"><p>없음</p></div>';
  if(negBox)negBox.innerHTML=`<p>${esc(r?.interview_commentary?.improvement_comment||"")}</p>`||'<div class="empty"><p>없음</p></div>';
  const jdBody=document.querySelector("#jdTable tbody");
  if(jdBody){
    jdBody.innerHTML=(r.compCoverage||[]).map(row=>{
      const eids = Array.isArray(row.evidence_ids) ? row.evidence_ids : [];
      const chips=eids.map(e=>`<span class="badge badge-indigo eid-link" data-eid="${esc(e)}" onclick="scrollToEvidence('${esc(e)}')">${esc(e)}</span>`).join(" ");
      return`<tr><td><strong style="color:#7c3aed;">${esc(row.competency||"")}</strong></td><td>${esc(row.expectation||"")}</td><td>${row.fulfillment||0}</td><td>${chips||'-'}</td></tr>`;
    }).join('');
  }
  const evBody=document.querySelector("#evTable tbody");
  if(evBody){
    evBody.innerHTML=(r.evidences||[]).map(ev=>`<tr id="ev-${esc(ev.eid)}" class="evidence-row"><td><strong style="color:#4f46e5;">${esc(ev.eid)}</strong></td><td style="color:#6b7280;font-size:0.75rem;">면접</td><td>${esc(ev.evidence)}</td><td><span class="badge badge-purple">${esc(ev.competency)}</span></td></tr>`).join('');
  }
  const statsElem=$("stats");
  if(statsElem&&r.interview_stat){
    const st=r.interview_stat;
    statsElem.innerHTML=`<div class="stats-item"><span class="stats-label">소요시간</span><span>:</span><span class="stats-value">${esc(st.duration||"-")}</span></div><div class="stats-item"><span class="stats-label">후속질문 평균</span><span>:</span><span class="stats-value">${esc(st.follow_up_avg||"-")}</span></div>`;
  }
  if($("loadingOverlay"))$("loadingOverlay").style.display="none";
}

function scrollToEvidence(eid){
  const tr=document.getElementById(`ev-${eid}`);
  if(!tr)return;
  document.querySelectorAll('.evidence-row').forEach(r=>r.classList.remove('evidence-highlight'));
  tr.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{tr.classList.add('evidence-highlight');setTimeout(()=>tr.classList.remove('evidence-highlight'),3000);},500);
}

function downloadHTML(){
  const rc=$("radarChart");
  let dataURL=null;
  if(rc&&rc.toDataURL){try{dataURL=rc.toDataURL('image/png');}catch(e){}}
  const html=document.documentElement.cloneNode(true);
  if(dataURL){
    const cc=html.querySelector('#radarChart');
    if(cc&&cc.parentNode){
      const img=document.createElement('img');
      img.id='radarChartImage';
      img.src=dataURL;
      img.alt='면접 핵심 평가 차트';
      img.style.cssText='display:block;width:100%;height:100%;object-fit:contain;';
      cc.parentNode.replaceChild(img,cc);
    }
    const head=html.querySelector('head');
    if(head){
      const style=document.createElement('style');
      style.textContent='.chart-container img#radarChartImage{width:100%!important;height:100%!important;object-fit:contain;display:block;}';
      head.appendChild(style);
    }
  }
  const lo=html.querySelector('#loadingOverlay');if(lo)lo.remove();
  const ha=html.querySelector('.header-actions');if(ha)ha.remove();
  const eb=html.querySelector('#errBox');if(eb)eb.remove();
  const str='<!DOCTYPE html>\n'+html.outerHTML;
  const blob=new Blob([str],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=`interview_report_${new Date().toISOString().slice(0,10)}.html`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function downloadPDF(){
  if(!currentReportData){alert('리포트 데이터가 없습니다.');return;}
  fetch('/reports/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({report:currentReportData})}).then(res=>{if(!res.ok)throw new Error('PDF 생성 실패');return res.blob();}).then(blob=>{const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`interview_report_${currentReportData?.metadata?.session_id||'report'}.pdf`;document.body.appendChild(link);link.click();document.body.removeChild(link);URL.revokeObjectURL(url);}).catch(e=>{console.error(e);alert('PDF 다운로드 중 오류 발생');});
}

async function startStreaming(){
  const params=new URLSearchParams(window.location.search);
  const sid=params.get('session_id');
  if(!sid){showError({code:'NO_SESSION',message:'session_id가 없습니다'});return;}
  const payload=new URLSearchParams();
  if(sid)payload.set('session_id',sid);
  if(params.get('axes_keys'))payload.set('axes_keys',params.get('axes_keys'));
  if(params.get('user_prompt'))payload.set('user_prompt',params.get('user_prompt'));
  try{
    const es=new EventSource('/reports/generate/stream?'+payload.toString());
    es.addEventListener('debate',e=>{
      const d=JSON.parse(e.data);
      if(d.debate_topic){
        addAgentMessage(d.agent,`→ ${d.debate_topic}`);
      }
      if(d.message){
        addAgentMessage(d.agent,d.message);
      }
    });
    es.addEventListener('error',e=>{try{const d=JSON.parse(e.data);showError({code:'AGENT_ERROR',message:d.message});}catch(err){showError({code:'AGENT_ERROR',message:'에이전트 오류 발생'});}es.close();});
    es.addEventListener('report',e=>{const ed=JSON.parse(e.data);const rd=ed.data||ed;currentReportData=rd;renderReport(rd);});
    es.addEventListener('done',e=>{if($("loadingOverlay"))$("loadingOverlay").style.display="none";es.close();});
    es.onerror=e=>{if(es.readyState===EventSource.CLOSED)console.log('EventSource 연결 종료');else showError({code:'STREAM_ERROR',message:'스트리밍 연결 오류'});es.close();};
  }catch(e){showError({code:'NETWORK',message:'네트워크 오류'});}
}

(function(){
  if($("dlBtn"))$("dlBtn").onclick=downloadHTML;
  if($("pdfBtn"))$("pdfBtn").onclick=downloadPDF;
  const params=new URLSearchParams(window.location.search);
  if(params.get('session_id'))startStreaming();
})();
</script>
</body>
</html>
