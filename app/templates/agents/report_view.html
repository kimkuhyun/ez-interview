<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>면접 리포트</title>
  <style>{% include 'css/report.css' %}</style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* 리포트 전용 뷰 스타일 */
    body {
      margin: 0;
      padding: 20px;
      background: #f9fafb;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    /* 로딩 화면 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 20px;
      font-size: 16px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <!-- 로딩 화면 + 에이전트 대화 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div style="max-width: 800px; width: 90%; background: white; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.15); padding: 2rem;">
      <div class="loading-spinner" style="margin: 0 auto 1rem;"></div>
      <div class="loading-text" style="text-align: center; margin-bottom: 1.5rem;">리포트를 생성하는 중...</div>

      <!-- 에이전트 대화 로그 (로딩 중에만 표시) -->
      <div id="agentChatBox" class="card agent-chat-card" style="display:none; margin: 0;">
        <div class="card-header"></div>
        <div id="agentChatContent" class="agent-chat-content"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- 헤더 (간소화) -->
    <div class="header">
      <div>
        <h1 id="reportTitle">면접 리포트</h1>
        <p>AI 기반 면접 평가 및 분석 결과</p>
      </div>
      <div class="header-actions">
        <button id="dlBtn" class="btn btn-success no-print">HTML 다운로드</button>
      </div>
    </div>
    <div class="header-line"></div>

    <!-- 실패 배너 -->
    <div id="errBox" class="alert alert-error" style="display:none;"></div>

    <!-- 리포트 본문 -->
    <div id="reportRoot">
      <!-- 헤드라인 (신뢰도 지표 추가) -->
      <div class="headline">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
          <div style="flex: 1;">
            <div id="headlineSummary" class="headline-summary"></div>
            <div id="headlineKeywords" class="headline-keywords"></div>
          </div>
          <div id="reliabilityScores" class="reliability-scores" style="display: none;">
            <div class="reliability-item">
              <div class="reliability-label">모순 정도</div>
              <div id="contradictionScore" class="reliability-value">-</div>
            </div>
            <div class="reliability-item">
              <div class="reliability-label">대화 깊이</div>
              <div id="depthScore" class="reliability-value">-</div>
            </div>
            <div class="reliability-item">
              <div class="reliability-label">신뢰도</div>
              <div id="reliabilityScore" class="reliability-value">-</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 차트 + 인터뷰 요약 -->
      <div class="grid-2">
        <div class="card card-indigo card-highlight">
          <div class="card-header">📊 핵심 평가</div>
          <div class="chart-container"><canvas id="radarChart"></canvas></div>
        </div>
        <div class="card card-emerald card-highlight">
          <div class="card-header">💬 인터뷰 요약</div>
          <div id="flowList" class="summary-scroll"></div>
        </div>
      </div>

      <!-- 긍/부정 의견 -->
      <div class="grid-2">
        <div class="card" style="border-color:#22d3ee">
          <div class="card-header">✅ 긍정 의견</div>
          <div id="posBox" class="prose"></div>
        </div>
        <div class="card" style="border-color:#fb7185">
          <div class="card-header">⚠️ 부정 의견</div>
          <div id="negBox" class="prose"></div>
        </div>
      </div>

      <!-- 핵심역량 -->
      <div class="card">
        <div class="card-header" style="color:#7c3aed;">📋 핵심역량</div>
        <div style="overflow-x:auto;">
          <table id="jdTable">
            <thead><tr><th>역량</th><th>요구사항 / 기대치</th><th>점수</th><th>근거</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 증거 맵 -->
      <div class="card">
        <div class="card-header" style="color:#d97706;">🔍 증거 맵</div>
        <div style="overflow-x:auto;">
          <table id="evTable">
            <thead><tr><th>EID</th><th>출처</th><th>내용</th><th>연결 JD</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 대화 통계 -->
      <div class="card">
        <div class="card-header" style="color:#0891b2;">📈 대화 통계</div>
        <div id="stats" class="stats"></div>
      </div>
    </div>
  </div>

  <script>
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

  // 전역 리포트 데이터
  let currentReportData = null;

  // ==== HTML 다운로드 ====
  function downloadHTML() {
    const htmlDoc = document.documentElement.cloneNode(true);

    // 로딩 오버레이 및 버튼 제거
    const loadingOverlay = htmlDoc.querySelector('#loadingOverlay');
    if (loadingOverlay) loadingOverlay.remove();
    const headerActions = htmlDoc.querySelector('.header-actions');
    if (headerActions) headerActions.remove();
    const errBox = htmlDoc.querySelector('#errBox');
    if (errBox) errBox.remove();

    const htmlStr = '<!DOCTYPE html>\n' + htmlDoc.outerHTML;
    const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `interview_report_${new Date().toISOString().slice(0,10)}.html`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function showError(err){
    const box=$("errBox");
    box.innerHTML =
      `<div class="alert-title">리포트 로드 실패</div>
       <div class="alert-body"><span class="code">${esc(err.code||'ERROR')}</span> ${esc(err.message||'오류')}</div>
       ${err.details?`<details class="alert-details"><summary>진단 정보</summary><pre>${esc(JSON.stringify(err.details,null,2))}</pre></details>`:''}`;
    box.style.display="block";

    // 로딩 오버레이 숨김
    const loadingOverlay = $("loadingOverlay");
    if (loadingOverlay) loadingOverlay.style.display = "none";
  }

  // ==== 렌더러 ====
  let radar;
  // ==== 에이전트 대화 메시지 추가 ====
  function addAgentMessage(agent, message) {
    const chatContent = $("agentChatContent");
    if (!chatContent) return;

    const msgDiv = document.createElement('div');
    msgDiv.className = 'agent-message';
    msgDiv.innerHTML = `
      <div class="agent-message-agent-name">${esc(agent)}</div>
      <div class="agent-message-content">${esc(message)}</div>
    `;

    chatContent.appendChild(msgDiv);

    // 자동 스크롤
    chatContent.scrollTop = chatContent.scrollHeight;
  }

  function renderReport(r){
    console.log('renderReport 시작, 데이터:', r);

    const reportRoot = $("reportRoot");
    if (reportRoot) reportRoot.style.display="block";

    const dlBtn = $("dlBtn");
    if (dlBtn) dlBtn.style.display="inline-block";

    const candidateName = r?.candidate_name || "지원자";
    const reportTitle = $("reportTitle");
    if (reportTitle) reportTitle.textContent = `${candidateName}의 면접 리포트`;

    const headlineSummary = $("headlineSummary");
    if (headlineSummary) headlineSummary.textContent = r?.headline?.summary || "";

    const keywords = (r?.headline?.tag || '').split(',').map(k => k.trim()).filter(Boolean);
    const headlineKeywords = $("headlineKeywords");
    if (headlineKeywords) {
      headlineKeywords.innerHTML = keywords.map(kw =>
        `<span class="headline-keyword">#${esc(kw)}</span>`
      ).join('');
    }

    // 신뢰도 점수 렌더링
    if (r?.headline?.contradiction_score !== undefined) {
      const reliabilityScores = $("reliabilityScores");
      if (reliabilityScores) {
        reliabilityScores.style.display = "flex";

        const contradictionScore = $("contradictionScore");
        if (contradictionScore) {
          const score = r.headline.contradiction_score;
          contradictionScore.textContent = `${score}%`;
          contradictionScore.style.color = score > 50 ? "#dc2626" : score > 30 ? "#f59e0b" : "#10b981";
        }

        const depthScore = $("depthScore");
        if (depthScore) {
          const score = r.headline.depth_score;
          depthScore.textContent = `${score}%`;
          depthScore.style.color = score > 70 ? "#10b981" : score > 50 ? "#f59e0b" : "#dc2626";
        }

        const reliabilityScore = $("reliabilityScore");
        if (reliabilityScore) {
          const score = r.headline.reliability_score;
          reliabilityScore.textContent = `${score}%`;
          reliabilityScore.style.color = score > 70 ? "#10b981" : score > 50 ? "#f59e0b" : "#dc2626";
        }
      }
    }

    // axes에서 key와 label 추출 (State에서 한글 label 직접 제공)
    const axes = r.axes || [];
    const keys = axes.map(a => a.key);

    // 차트 레이블: axes의 label 사용, 없으면 key 사용
    const labels = axes.map(a => a.label || a.key);

    // scores 객체 생성
    let scoresObj = {};
    if (Array.isArray(r.scores)) {
      r.scores.forEach(s => { scoresObj[s.key] = s.value; });
    } else {
      scoresObj = r.scores || {};
    }

    // key 순서대로 values 배열 생성
    const values = keys.map(k => {
      const score = scoresObj[k];
      return (typeof score === "number") ? score : 0;
    });

    console.log('=== 차트 디버깅 (새 창) ===');
    console.log('axes:', axes);
    console.log('keys:', keys);
    console.log('labels:', labels);
    console.log('scoresObj:', scoresObj);
    console.log('values:', values);

    // 차트 렌더링 (안전하게)
    const radarCanvas = $("radarChart");
    if (radarCanvas) {
      if (radar) radar.destroy();
      radar = new Chart(radarCanvas, {
        type:'radar',
        data:{
          labels: labels,
          datasets:[{
            label:'점수',
            data:values,
            fill:true,
            backgroundColor:'rgba(99,102,241,0.2)',
            borderColor:'rgb(79,70,229)',
            borderWidth:2,
            pointBackgroundColor:'rgb(79,70,229)',
            pointBorderColor:'#fff',
            pointBorderWidth:2,
            pointRadius:4
          }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:true,
          scales:{
            r:{
              beginAtZero:true,
              min:0,
              max:100,
              ticks:{ stepSize:20 }
            }
          },
          plugins:{
            legend:{ display:false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return context.label + ': ' + context.parsed.r + '점';
                }
              }
            }
          }
        }
      });
    }

    const items = (r.talkSummary && r.talkSummary.items) ? r.talkSummary.items : [];
    const overall = items.find(x=>x.주제==='인터뷰 요약');
    const pos = items.find(x=>x.주제==='긍정 의견');
    const neg = items.find(x=>x.주제==='부정 의견');
    const flows = items.filter(x=>x.주제!=='인터뷰 요약' && x.주제!=='긍정 의견' && x.주제!=='부정 의견');

    let flowHTML = '';
    if (overall && overall.발언요약) {
      flowHTML += `
        <div class="qa-simple" style="border-left:3px solid #10b981;background:#f0fdf4;">
          <div class="qa-topic" style="font-weight:600;color:#059669;">전체 요약</div>
          <div class="qa-summary">${esc(overall.발언요약)}</div>
        </div>`;
    }
    flowHTML += flows.map(it=>{
      const topic = it.주제 || '';
      const content = it.발언요약 || '';
      return `
        <div class="qa-simple">
          <div class="qa-topic">${esc(topic)}</div>
          <div class="qa-summary">${esc(content)}</div>
        </div>`;
    }).join("");
    if (!flowHTML) flowHTML = '<div class="empty"><p>인터뷰 요약이 없습니다</p></div>';

    const flowList = $("flowList");
    if (flowList) flowList.innerHTML = flowHTML;

    const posBox = $("posBox");
    if (posBox) posBox.innerHTML = pos ? `<p>${esc(pos.발언요약||'')}</p>` : '<div class="empty"><p>없음</p></div>';

    const negBox = $("negBox");
    if (negBox) negBox.innerHTML = neg ? `<p>${esc(neg.발언요약||'')}</p>` : '<div class="empty"><p>없음</p></div>';

    const jdBody = document.querySelector("#jdTable tbody");
    if (!jdBody) {
      console.warn('jdTable tbody를 찾을 수 없습니다');
      return;
    }
    const axesMap = {};
    (r.axes||[]).forEach((ax, idx) => { axesMap[`C${String(idx+1).padStart(2,'0')}`] = ax; });

    const competencyNames = {
      "problem_solving": "문제해결능력",
      "communication": "커뮤니케이션",
      "self_driven_initiative": "자기주도성",
      "collaboration": "협업능력",
      "professional_expertise": "전문성"
    };

    jdBody.innerHTML = (r.jdCoverage||[]).map(row=>{
      const chips = (row.근거||[]).map(e =>
        `<span class="badge badge-indigo eid-link" data-eid="${esc(e)}" onclick="scrollToEvidence('${esc(e)}')">${esc(e)}</span>`
      ).join(" ");

      const axInfo = axesMap[row.jid];
      let score = 0, competencyName = row.jid;
      if (axInfo && scoresObj[axInfo.key] !== undefined) {
        score = scoresObj[axInfo.key];
        competencyName = competencyNames[axInfo.key] || axInfo.label || axInfo.key;
      }

      const expect = String(row.기대치 || '').replace(/^\s*(기준[:\s-]*)?/,'').trim();
      const fulfillBadge = `<div class="fulfillment-badge"><span class="fulfillment-score">${score}점</span></div>`;

      return `<tr>
        <td><strong style="color:#7c3aed;">${esc(competencyName)}</strong></td>
        <td>${esc(row.요구사항)}<div class="jd-expectation">기준: ${esc(expect)}</div></td>
        <td>${fulfillBadge}</td>
        <td>${chips||'<span style="color:#9ca3af;">-</span>'}</td>
      </tr>`;
    }).join("");

    const evBody = document.querySelector("#evTable tbody");
    if (evBody) {
      evBody.innerHTML = (r.evidence||[]).map(ev=>{
        const axInfo = axesMap[ev.jid];
        let competencyName = ev.jid;
        if (axInfo) competencyName = competencyNames[axInfo.key] || axInfo.label || axInfo.key;

        return `<tr id="ev-${esc(ev.eid)}" class="evidence-row">
          <td><strong style="color:#4f46e5;">${esc(ev.eid)}</strong></td>
          <td style="color:#6b7280;font-size:0.75rem;">${esc(ev.출처)}</td>
          <td>${esc(ev.내용)}</td>
          <td><span class="badge badge-purple">${esc(competencyName)}</span></td>
        </tr>`;
      }).join("");
    }

    const statsElem = $("stats");
    if (statsElem) {
      statsElem.innerHTML = (r.convStats||[]).map(kv =>
        `<div class="stats-item"><span class="stats-label">${esc(kv.k)}</span><span>:</span><span class="stats-value">${esc(kv.v)}</span></div>`
      ).join("");
    }

    // 로딩 오버레이 숨김
    const loadingOverlay = $("loadingOverlay");
    if (loadingOverlay) loadingOverlay.style.display = "none";

    console.log('renderReport 완료');
  }

  // EID 클릭 시 증거 맵 하이라이트
  function scrollToEvidence(eid) {
    const targetRow = document.getElementById(`ev-${eid}`);
    if (!targetRow) return;
    document.querySelectorAll('.evidence-row').forEach(row => row.classList.remove('evidence-highlight'));
    targetRow.scrollIntoView({ behavior:'smooth', block:'center' });
    setTimeout(() => {
      targetRow.classList.add('evidence-highlight');
      setTimeout(() => targetRow.classList.remove('evidence-highlight'), 3000);
    }, 500);
  }

  // ==== 외부에서 데이터를 전달받는 함수 (부모 창에서 호출) ====
  window.loadReportData = function(data) {
    console.log('loadReportData 호출됨, 데이터:', data);

    if (!data) {
      showError({
        code: 'NO_DATA',
        message: '전달받은 리포트 데이터가 없습니다'
      });
      return;
    }

    if (data.status === 'failed') {
      showError(data);
      return;
    }

    currentReportData = data;
    renderReport(data);
  };

  // ==== 쿼리 파라미터 파싱 ====
  function getQueryParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      session_id: params.get('session_id'),
      axes_keys: params.get('axes_keys'),
      user_prompt: params.get('user_prompt')
    };
  }

  // ==== 스트리밍 시작 ====
  async function startStreaming() {
    const params = getQueryParams();

    if (!params.session_id) {
      showError({
        code: 'NO_SESSION',
        message: 'session_id가 제공되지 않았습니다'
      });
      return;
    }

    const agentChatBox = $("agentChatBox");
    const agentChatContent = $("agentChatContent");

    // 에이전트 대화 박스 표시 및 초기화
    if (agentChatBox) agentChatBox.style.display = "block";
    if (agentChatContent) agentChatContent.innerHTML = "";

    const payload = new URLSearchParams();
    if (params.session_id) payload.set('session_id', params.session_id);
    if (params.axes_keys) payload.set('axes_keys', params.axes_keys);
    if (params.user_prompt) payload.set('user_prompt', params.user_prompt);

    try {
      // EventSource로 스트리밍 연결
      const eventSource = new EventSource('/reports/generate/stream?' + payload.toString());

      eventSource.addEventListener('log', (e) => {
        const data = JSON.parse(e.data);
        console.log('[LOG]', data.agent, ':', data.message);
        addAgentMessage(data.agent, data.message);
      });

      eventSource.addEventListener('error', (e) => {
        const data = JSON.parse(e.data);
        console.error('[ERROR]', data.message);
        showError({code:'AGENT_ERROR', message:data.message});
        eventSource.close();
      });

      eventSource.addEventListener('report', (e) => {
        const data = JSON.parse(e.data);
        console.log('[REPORT] 리포트 생성 완료');

        currentReportData = data.data;
        renderReport(data.data);
      });

      eventSource.addEventListener('done', (e) => {
        console.log('[DONE] 스트리밍 완료');
        eventSource.close();
      });

      eventSource.onerror = (e) => {
        console.error('[EventSource Error]', e);
        if (eventSource.readyState === EventSource.CLOSED) {
          console.log('EventSource 연결 종료');
        } else {
          showError({code:'STREAM_ERROR', message:'스트리밍 연결 오류'});
        }
        eventSource.close();
      };

    } catch(e){
      console.error('[Exception]', e);
      showError({code:'NETWORK', message:'네트워크 오류', details:{why:String(e)}});
    }
  }

  // ==== 초기화 ====
  (function init() {
    console.log('리포트 뷰 초기화');

    // 다운로드 버튼 이벤트 바인딩
    const dlBtn = $("dlBtn");
    if (dlBtn) dlBtn.onclick = downloadHTML;

    // 쿼리 파라미터 확인 후 자동 스트리밍 시작
    const params = getQueryParams();
    console.log('쿼리 파라미터:', params);

    if (params.session_id) {
      console.log('자동 스트리밍 시작...');
      startStreaming();
    } else {
      console.log('session_id가 없어 부모 창으로부터 데이터 전달 대기 중...');
    }
  })();
  </script>
</body>
</html>
