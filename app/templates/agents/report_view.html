<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>면접 리포트</title>
  <style>{% include 'css/report.css' %}</style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* 리포트 전용 뷰 스타일 */
    body {
      margin: 0;
      padding: 20px;
      background: #f9fafb;
      font-family: 'Malgun Gothic', sans-serif;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    /* 로딩 화면 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 20px;
      font-size: 16px;
      color: #6b7280;
    }

    /* 슬롯머신 스타일 문구 */
    .slot-wrapper {
      margin-top: 0.5rem;
      height: 1.6em;
      overflow: hidden;
      position: relative;
      text-align: center;
      font-size: 1rem;
      color: #4b5563;
      font-weight: 600;
    }
    .slot-text {
      display: inline-block;
      min-width: 100%;
      animation: slotFadeUp 0.35s ease-out;
    }
    @keyframes slotFadeUp {
      from {
        opacity: 0;
        transform: translateY(100%);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 디베이트 로그 스타일 */
    .debate-container {
      margin-top: 1rem;
      max-height: 300px;
      overflow-y: auto;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
    }
    .debate-turn {
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      animation: fadeIn 0.3s ease-out;
    }
   /* .debate-turn.agent-a {
      background: #eff6ff;
      border-left: 3px solid #3b82f6;
    }
    .debate-turn.agent-b {
      background: #fef3c7;
      border-left: 3px solid #f59e0b;
    }
    .debate-speaker {
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
    }
    .debate-turn.agent-a .debate-speaker {
      color: #3b82f6;
    }
    .debate-turn.agent-b .debate-speaker {
      color: #f59e0b;
    }*/
    .debate-content {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #374151;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- 로딩 화면 (슬롯머신 문구 + 디베이트 로그) -->
  <div id="loadingOverlay" class="loading-overlay">
    <div style="max-width: 900px; width: 90%; background: white; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.15); padding: 2rem; text-align: center;">
      <div class="loading-spinner" style="margin: 0 auto 1rem;"></div>
      <div class="loading-text" style="margin-bottom: 0.5rem;"></div>
      <div class="slot-wrapper">
        <span id="slotText" class="slot-text">시작 준비 중...</span>
      </div>

      <!-- 디베이트 로그 (AgentA vs AgentB 토론) -->
      <div id="debateLog" class="debate-container" style="display: none; text-align: left;">
        <h3 style="font-size: 0.95rem; font-weight: 700; color: #374151; margin-bottom: 0.75rem;">
          
        </h3>
        <div id="debateContent"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- 헤더 (간소화) -->
    <div class="header">
      <div>
        <h1 id="reportTitle">면접 리포트</h1>
        <p>AI 기반 면접 평가 및 분석 결과</p>
      </div>
      <div class="header-actions">
        <button id="dlBtn" class="btn btn-success no-print">HTML 다운로드</button>
      </div>
    </div>
    <div class="header-line"></div>

    <!-- 실패 배너 -->
    <div id="errBox" class="alert alert-error" style="display:none;"></div>

    <!-- 리포트 본문 -->
    <div id="reportRoot">
      <!-- 헤드라인 (신뢰도 지표 추가) -->
      <div class="headline">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
          <div style="flex: 1;">
            <div id="headlineSummary" class="headline-summary"></div>
            <div id="headlineKeywords" class="headline-keywords"></div>
          </div>
          <div id="reliabilityScores" class="reliability-scores" style="display: none;">
            <div class="reliability-item">
              <div class="reliability-label">모순 정도</div>
              <div id="contradictionScore" class="reliability-value">-</div>
            </div>
            <div class="reliability-item">
              <div class="reliability-label">대화 깊이</div>
              <div id="depthScore" class="reliability-value">-</div>
            </div>
            <div class="reliability-item">
              <div class="reliability-label">신뢰도</div>
              <div id="reliabilityScore" class="reliability-value">-</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 차트 + 인터뷰 요약 -->
      <div class="grid-2">
        <div class="card card-indigo card-highlight">
          <div class="card-header">핵심 평가</div>
          <div class="chart-container"><canvas id="radarChart"></canvas></div>
        </div>
        <div class="card card-emerald card-highlight">
          <div class="card-header">인터뷰 요약</div>
          <div id="flowList" class="summary-scroll"></div>
        </div>
      </div>

      <!-- 긍/부정 의견 -->
      <div class="grid-2">
        <div class="card" style="border-color:#22d3ee">
          <div class="card-header">긍정 의견</div>
          <div id="posBox" class="prose"></div>
        </div>
        <div class="card" style="border-color:#fb7185">
          <div class="card-header">부정 의견</div>
          <div id="negBox" class="prose"></div>
        </div>
      </div>

      <!-- 핵심역량 -->
      <div class="card">
        <div class="card-header" style="color:#7c3aed;">핵심역량</div>
        <div style="overflow-x:auto;">
          <table id="jdTable">
            <thead><tr><th>역량</th><th>요구사항 / 기대치</th><th>점수</th><th>근거</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 증거 맵 -->
      <div class="card">
        <div class="card-header" style="color:#d97706;">증거 맵</div>
        <div style="overflow-x:auto;">
          <table id="evTable">
            <thead><tr><th>EID</th><th>출처</th><th>내용</th><th>연결 JD</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 대화 통계 -->
      <div class="card">
        <div class="card-header" style="color:#0891b2;">대화 통계</div>
        <div id="stats" class="stats"></div>
      </div>
    </div>
  </div>

  <script>
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

  // 슬롯머신 로딩 문구 리스트
  const SLOT_MESSAGES = [
    "이력서를 확인하는 중...",
    "JD를 스캔하는 중...",
    "인터뷰 로그를 정규화하는 중...",
    "대화 타임라인을 분석하는 중...",
    "핵심 역량을 비교하는 중...",
    "JD 기준을 매칭하는 중...",
    "근거 데이터를 정리하는 중...",
    "점수 분포를 계산하는 중...",
    "요약 후보를 생성하는 중...",
    "표현을 간결하게 다듬는 중...",
    "중복된 문장을 제거하는 중...",
    "의미적 유사도를 평가하는 중...",
    "JD 가중치를 반영하는 중...",
    "사용자의 답변을 재해석하는 중...",
    "면접 흐름을 복원하는 중...",
    "의도 파악 정확도를 높이는 중...",
    "모순 가능성을 탐지하는 중...",
    "대화 깊이를 측정하는 중...",
    "대화 신뢰도를 산출하는 중...",
    "관찰 포인트를 추출하는 중...",
    "핵심 문장을 정렬하는 중...",
    "증거-요구사항 연결을 확인하는 중...",
    "노이즈 문장을 제거하는 중...",
    "답변 분포를 구조화하는 중...",
    "리포트 구조를 정비하는 중...",
    "문맥을 통합하는 중...",
    "전반적 인상을 계산하는 중...",
    "태그를 분류하는 중...",
    "가중 점수 반영 중...",
    "최적의 설명을 선택하는 중...",
    "부정·긍정 포인트를 분리하는 중...",
    "근거들을 재배열하는 중...",
    "요약 품질을 검증하는 중...",
    "최종 형태로 포맷팅 중...",
    "PDF 가능 여부를 확인하는 중...",
    "차트 데이터를 구성하는 중...",
    "결과물 정합성을 확인하는 중...",
    "에러를 점검하는 중...",
    "최종 결과를 조립하는 중..."
  ];

  let slotAnimationInterval = null;

  function startSlotAnimation() {
    const el = document.getElementById("slotText");
    if (!el) return;

    // 기존 인터벌이 있으면 정리
    if (slotAnimationInterval) {
      clearInterval(slotAnimationInterval);
    }

    slotAnimationInterval = setInterval(() => {
      const msg = SLOT_MESSAGES[Math.floor(Math.random() * SLOT_MESSAGES.length)];
      el.textContent = msg;
      el.classList.remove("slot-text");
      void el.offsetWidth; // reflow
      el.classList.add("slot-text");
    }, 2000);
  }

  function stopSlotAnimation() {
    if (slotAnimationInterval) {
      clearInterval(slotAnimationInterval);
      slotAnimationInterval = null;
    }
  }

  // 전역 리포트 데이터
  let currentReportData = null;

  // ==== HTML 다운로드 ====
  function downloadHTML() {
    try {
      // 1) 현재 화면에 렌더된 차트를 이미지로 캡처
      const radarCanvas = document.getElementById('radarChart');
      let chartDataURL = null;

      if (radarCanvas && radarCanvas.toDataURL) {
        try {
          chartDataURL = radarCanvas.toDataURL('image/png');
        } catch (e) {
          console.warn('차트 캡처 실패:', e);
        }
      }

      // 2) DOM 전체 클론 (<html> 엘리먼트 기준)
      const htmlEl = document.documentElement.cloneNode(true);

      // 3) 캔버스를 이미지로 교체
      if (chartDataURL) {
        const clonedCanvas = htmlEl.querySelector('#radarChart');
        if (clonedCanvas && clonedCanvas.parentNode) {
          const img = document.createElement('img');
          img.id = 'radarChartImage';
          img.src = chartDataURL;
          img.alt = '면접 핵심 평가 차트';

          // 캔버스와 동일한 박스에 맞추도록
          img.style.display = 'block';
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'contain';

          clonedCanvas.parentNode.replaceChild(img, clonedCanvas);
        }
      }

      // 3-1) 혹시 report.css에 canvas 전용 규칙만 있을 경우를 대비해
      //       다운로드용 HTML에 img용 규칙을 하나 더 주입
      const head = htmlEl.querySelector('head');
      if (head) {
        const extraStyle = document.createElement('style');
        extraStyle.textContent = `
          .chart-container img#radarChartImage {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            display: block;
          }
        `;
        head.appendChild(extraStyle);
      }

      // 4) 로딩 오버레이 / 버튼 제거
      const loadingOverlay = htmlEl.querySelector('#loadingOverlay');
      if (loadingOverlay) loadingOverlay.remove();

      const headerActions = htmlEl.querySelector('.header-actions');
      if (headerActions) headerActions.remove();

      const errBox = htmlEl.querySelector('#errBox');
      if (errBox) errBox.remove();

      // 5) HTML 파일로 다운로드
      const htmlStr = '<!DOCTYPE html>\n' + htmlEl.outerHTML;
      const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `interview_report_${new Date().toISOString().slice(0,10)}.html`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    } catch (e) {
      console.error('downloadHTML 오류', e);
      alert('HTML 다운로드 중 오류가 발생했습니다. (콘솔 확인)');
    }
  }
  function showError(err){
    const box=$("errBox");
    box.innerHTML =
      `<div class="alert-title">리포트 로드 실패</div>
       <div class="alert-body"><span class="code">${esc(err.code||'ERROR')}</span> ${esc(err.message||'오류')}</div>
       ${err.details?`<details class="alert-details"><summary>진단 정보</summary><pre>${esc(JSON.stringify(err.details,null,2))}</pre></details>`:''}`;
    box.style.display="block";

    // 로딩 오버레이 숨김
    const loadingOverlay = $("loadingOverlay");
    if (loadingOverlay) loadingOverlay.style.display = "none";
  }

  // ==== 렌더러 ====
  let radar;

  // 에이전트 로그를 슬롯 텍스트로 표시
  function addAgentMessage(agent, message) {
    const slotText = $("slotText");
    if (!slotText) return;

    // 에이전트 이름 + 메시지를 슬롯에 표시
    const displayText = `[${agent}] ${message}`;
    slotText.textContent = displayText;

    // 애니메이션 리셋
    slotText.classList.remove("slot-text");
    void slotText.offsetWidth; // reflow
    slotText.classList.add("slot-text");

    console.log('[에이전트 로그]', agent, ':', message);
  }

  // 디베이트 로그 표시
  function showDebateLog(turns) {
    const debateLog = $("debateLog");
    const debateContent = $("debateContent");

    if (!debateLog || !debateContent || !turns || !turns.length) return;

    console.log("[디베이트 로그] 표시 시작, 총", turns.length, "턴");

    // 컨테이너 보이기
    debateLog.style.display = "block";
    debateContent.innerHTML = "";

    // 타이핑/턴 간 속도 설정
    const TYPING_INTERVAL = 35;   // 글자당 ms (숫자 키우면 더 느리게)
    const TURN_DELAY = 700;       // 한 턴이 끝난 뒤 다음 턴까지 대기 시간(ms)
    function typeText(element, text, onDone) {
      let idx = 0;

      function step() {
        if (idx < text.length) {
          element.textContent += text.charAt(idx++);
          // 매 글자마다 스크롤 맨 아래 유지
          debateContent.scrollTop = debateContent.scrollHeight;
          setTimeout(step, TYPING_INTERVAL);
        } else {
          if (typeof onDone === "function") {
            setTimeout(onDone, TURN_DELAY);
          }
        }
      }

      step();
    }

    // 턴 순차 렌더링
    function renderTurn(index) {
      if (index >= turns.length) return;

      const turn = turns[index];

      const speakerClass = (turn.speaker || "")
        .toLowerCase()
        .includes("agenta")
        ? "agent-a"
        : "agent-b";

      const speakerName =
        speakerClass === "agent-a" ? "열정적인 채용 담당자" : "냉철한 인사 담당자";

      const turnDiv = document.createElement("div");
      turnDiv.className = `debate-turn ${speakerClass}`;

      const speakerDiv = document.createElement("div");
      speakerDiv.className = "debate-speaker";
      speakerDiv.textContent = speakerName;

      const contentDiv = document.createElement("div");
      contentDiv.className = "debate-content";
      contentDiv.textContent = ""; // 타이핑으로 채울 것

      turnDiv.appendChild(speakerDiv);
      turnDiv.appendChild(contentDiv);
      debateContent.appendChild(turnDiv);

      // 현재 턴 타이핑 후 다음 턴으로
      typeText(contentDiv, String(turn.content || ""), () => {
        renderTurn(index + 1);
      });
    }

    // 첫 턴부터 시작
    renderTurn(0);
  }

  function renderReport(r){
    console.log('renderReport 시작, 데이터:', r);

    const reportRoot = $("reportRoot");
    if (reportRoot) reportRoot.style.display="block";

    const dlBtn = $("dlBtn");
    if (dlBtn) dlBtn.style.display="inline-block";

    const candidateName = r?.candidate_name || "지원자";
    const reportTitle = $("reportTitle");
    if (reportTitle) reportTitle.textContent = `${candidateName}의 면접 리포트`;

    const headlineSummary = $("headlineSummary");
    if (headlineSummary) headlineSummary.textContent = r?.headline?.summary || "";

    // tag는 배열 또는 쉼표 구분 문자열일 수 있음
    let keywords = [];
    if (r?.headline?.tag) {
      if (Array.isArray(r.headline.tag)) {
        keywords = r.headline.tag.filter(Boolean);
      } else {
        keywords = String(r.headline.tag).split(',').map(k => k.trim()).filter(Boolean);
      }
    }
    const headlineKeywords = $("headlineKeywords");
    if (headlineKeywords) {
      headlineKeywords.innerHTML = keywords.map(kw =>
        `<span class="headline-keyword">#${esc(kw)}</span>`
      ).join('');
    }

    // 신뢰도 점수 렌더링
    if (r?.headline?.contradiction_score !== undefined) {
      const reliabilityScores = $("reliabilityScores");
      if (reliabilityScores) {
        reliabilityScores.style.display = "flex";

        const contradictionScore = $("contradictionScore");
        if (contradictionScore) {
          const score = r.headline.contradiction_score;
          contradictionScore.textContent = `${score}%`;
          contradictionScore.style.color = score > 50 ? "#dc2626" : score > 30 ? "#f59e0b" : "#10b981";
        }

        const depthScore = $("depthScore");
        if (depthScore) {
          const score = r.headline.depth_score;
          depthScore.textContent = `${score}%`;
          depthScore.style.color = score > 70 ? "#10b981" : score > 50 ? "#f59e0b" : "#dc2626";
        }

        const reliabilityScore = $("reliabilityScore");
        if (reliabilityScore) {
          const score = r.headline.reliability_score;
          reliabilityScore.textContent = `${score}%`;
          reliabilityScore.style.color = score > 70 ? "#10b981" : score > 50 ? "#f59e0b" : "#dc2626";
        }
      }
    }

    // axes에서 key와 label 추출
    const axes = r.axes || [];
    const keys = axes.map(a => a.key);
    const labels = axes.map(a => a.label || a.key);

    // scores 객체 생성
    let scoresObj = {};
    if (Array.isArray(r.scores)) {
      r.scores.forEach(s => { scoresObj[s.key] = s.value; });
    } else {
      scoresObj = r.scores || {};
    }

    const values = keys.map(k => {
      const score = scoresObj[k];
      return (typeof score === "number") ? score : 0;
    });

    console.log('=== 차트 디버깅 (새 창) ===');
    console.log('axes:', axes);
    console.log('keys:', keys);
    console.log('labels:', labels);
    console.log('scoresObj:', scoresObj);
    console.log('values:', values);

    // 차트 렌더링
    const radarCanvas = $("radarChart");
    if (radarCanvas) {
      if (radar) radar.destroy();
      radar = new Chart(radarCanvas, {
        type:'radar',
        data:{
          labels: labels,
          datasets:[{
            label:'점수',
            data:values,
            fill:true,
            backgroundColor:'rgba(99,102,241,0.2)',
            borderColor:'rgb(79,70,229)',
            borderWidth:2,
            pointBackgroundColor:'rgb(79,70,229)',
            pointBorderColor:'#fff',
            pointBorderWidth:2,
            pointRadius:4
          }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:true,
          scales:{
            r:{
              beginAtZero:true,
              min:0,
              max:100,
              ticks:{ stepSize:20 }
            }
          },
          plugins:{
            legend:{ display:false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return context.label + ': ' + context.parsed.r + '점';
                }
              }
            }
          }
        }
      });
    }

    const items = (r.talkSummary && r.talkSummary.items) ? r.talkSummary.items : [];
    const overall = items.find(x=>x.주제==='인터뷰 요약');
    const pos = items.find(x=>x.주제==='긍정 의견');
    const neg = items.find(x=>x.주제==='부정 의견');
    const flows = items.filter(x=>x.주제!=='인터뷰 요약' && x.주제!=='긍정 의견' && x.주제!=='부정 의견');

    let flowHTML = '';
    if (overall && overall.발언요약) {
      flowHTML += `
        <div class="qa-simple" style="border-left:3px solid #10b981;background:#f0fdf4;">
          <div class="qa-topic" style="font-weight:600;color:#059669;">전체 요약</div>
          <div class="qa-summary">${esc(overall.발언요약)}</div>
        </div>`;
    }
    flowHTML += flows.map(it=>{
      const topic = it.주제 || '';
      const content = it.발언요약 || '';
      return `
        <div class="qa-simple">
          <div class="qa-topic">${esc(topic)}</div>
          <div class="qa-summary">${esc(content)}</div>
        </div>`;
    }).join("");
    if (!flowHTML) flowHTML = '<div class="empty"><p>인터뷰 요약이 없습니다</p></div>';

    const flowList = $("flowList");
    if (flowList) flowList.innerHTML = flowHTML;

    const posBox = $("posBox");
    if (posBox) posBox.innerHTML = pos ? `<p>${esc(pos.발언요약||'')}</p>` : '<div class="empty"><p>없음</p></div>';

    const negBox = $("negBox");
    if (negBox) negBox.innerHTML = neg ? `<p>${esc(neg.발언요약||'')}</p>` : '<div class="empty"><p>없음</p></div>';

    const jdBody = document.querySelector("#jdTable tbody");
    if (!jdBody) {
      console.warn('jdTable tbody를 찾을 수 없습니다');
      return;
    }
    const axesMap = {};
    (r.axes||[]).forEach((ax, idx) => { axesMap[`C${String(idx+1).padStart(2,'0')}`] = ax; });

    const competencyNames = {
      "problem_solving": "문제해결능력",
      "communication": "커뮤니케이션",
      "self_driven_initiative": "자기주도성",
      "collaboration": "협업능력",
      "professional_expertise": "전문성"
    };

    jdBody.innerHTML = (r.jdCoverage||[]).map(row=>{
      const chips = (row.근거||[]).map(e =>
        `<span class="badge badge-indigo eid-link" data-eid="${esc(e)}" onclick="scrollToEvidence('${esc(e)}')">${esc(e)}</span>`
      ).join(" ");

      const axInfo = axesMap[row.jid];
      let score = 0, competencyName = row.jid;
      if (axInfo && scoresObj[axInfo.key] !== undefined) {
        score = scoresObj[axInfo.key];
        competencyName = competencyNames[axInfo.key] || axInfo.label || axInfo.key;
      }

      const expect = String(row.기대치 || '').replace(/^\s*(기준[:\s-]*)?/,'').trim();
      const fulfillBadge = `<div class="fulfillment-badge"><span class="fulfillment-score">${score}점</span></div>`;

      return `<tr>
        <td><strong style="color:#7c3aed;">${esc(competencyName)}</strong></td>
        <td>${esc(row.요구사항)}<div class="jd-expectation">기준: ${esc(expect)}</div></td>
        <td>${fulfillBadge}</td>
        <td>${chips||'<span style="color:#9ca3af;">-</span>'}</td>
      </tr>`;
    }).join("");

    const evBody = document.querySelector("#evTable tbody");
    if (evBody) {
      evBody.innerHTML = (r.evidence||[]).map(ev=>{
        const axInfo = axesMap[ev.jid];
        let competencyName = ev.jid;
        if (axInfo) competencyName = competencyNames[axInfo.key] || axInfo.label || axInfo.key;

        return `<tr id="ev-${esc(ev.eid)}" class="evidence-row">
          <td><strong style="color:#4f46e5;">${esc(ev.eid)}</strong></td>
          <td style="color:#6b7280;font-size:0.75rem;">${esc(ev.출처)}</td>
          <td>${esc(ev.내용)}</td>
          <td><span class="badge badge-purple">${esc(competencyName)}</span></td>
        </tr>`;
      }).join("");
    }

    const statsElem = $("stats");
    if (statsElem) {
      statsElem.innerHTML = (r.convStats||[]).map(kv =>
        `<div class="stats-item"><span class="stats-label">${esc(kv.k)}</span><span>:</span><span class="stats-value">${esc(kv.v)}</span></div>`
      ).join("");
    }

    // 로딩 오버레이 숨김
    const loadingOverlay = $("loadingOverlay");
    if (loadingOverlay) loadingOverlay.style.display = "none";

    console.log('renderReport 완료');
  }

  // EID 클릭 시 증거 맵 하이라이트
  function scrollToEvidence(eid) {
    const targetRow = document.getElementById(`ev-${eid}`);
    if (!targetRow) return;
    document.querySelectorAll('.evidence-row').forEach(row => row.classList.remove('evidence-highlight'));
    targetRow.scrollIntoView({ behavior:'smooth', block:'center' });
    setTimeout(() => {
      targetRow.classList.add('evidence-highlight');
      setTimeout(() => targetRow.classList.remove('evidence-highlight'), 3000);
    }, 500);
  }

  // ==== 외부에서 데이터를 전달받는 함수 (부모 창에서 호출) ====
  window.loadReportData = function(data) {
    console.log('loadReportData 호출됨, 데이터:', data);

    if (!data) {
      showError({
        code: 'NO_DATA',
        message: '전달받은 리포트 데이터가 없습니다'
      });
      return;
    }

    if (data.status === 'failed') {
      showError(data);
      return;
    }

    currentReportData = data;
    renderReport(data);
  };

  // ==== 쿼리 파라미터 파싱 ====
  function getQueryParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      session_id: params.get('session_id'),
      axes_keys: params.get('axes_keys'),
      user_prompt: params.get('user_prompt')
    };
  }

  // ==== 스트리밍 시작 ====
  async function startStreaming() {
    const params = getQueryParams();

    if (!params.session_id) {
      showError({
        code: 'NO_SESSION',
        message: 'session_id가 제공되지 않았습니다'
      });
      return;
    }

    const agentChatBox = $("agentChatBox");
    const agentChatContent = $("agentChatContent");

    // (에이전트 박스는 이제 DOM에 없으므로, null이면 아무 것도 안 함)
    if (agentChatBox) agentChatBox.style.display = "block";
    if (agentChatContent) agentChatContent.innerHTML = "";

    const payload = new URLSearchParams();
    if (params.session_id) payload.set('session_id', params.session_id);
    if (params.axes_keys) payload.set('axes_keys', params.axes_keys);
    if (params.user_prompt) payload.set('user_prompt', params.user_prompt);

    try {
      // EventSource로 스트리밍 연결
      const eventSource = new EventSource('/reports/generate/stream?' + payload.toString());

      eventSource.addEventListener('log', (e) => {
        const data = JSON.parse(e.data);
        console.log('[LOG]', data.agent, ':', data.message);

        // 슬롯 애니메이션 중지하고 실제 에이전트 메시지 표시
        stopSlotAnimation();
        addAgentMessage(data.agent, data.message);
      });

      eventSource.addEventListener('debate', (e) => {
        const data = JSON.parse(e.data);
        console.log('[DEBATE] 디베이트 로그 수신, 턴 수:', data.turns?.length);

        // 슬롯 애니메이션 중지하고 디베이트 로그 표시
        stopSlotAnimation();

        // 슬롯 텍스트 업데이트
        const slotText = $("slotText");
        if (slotText) {
          slotText.textContent = "인터뷰 로그 분석 진행 중...";
        }

        // 디베이트 로그 표시
        if (data.turns && data.turns.length > 0) {
          showDebateLog(data.turns);
        }
      });

      eventSource.addEventListener('error', (e) => {
        const data = JSON.parse(e.data);
        console.error('[ERROR]', data.message);
        showError({code:'AGENT_ERROR', message:data.message});
        eventSource.close();
      });

      eventSource.addEventListener('report', (e) => {
        const eventData = JSON.parse(e.data);
        console.log('[REPORT] 리포트 생성 완료, 데이터:', eventData);

        // eventData = {type: "report", data: {...실제 리포트...}}
        const reportData = eventData.data || eventData;
        console.log('[REPORT] 리포트 데이터 추출:', reportData);

        currentReportData = reportData;
        renderReport(reportData);
      });

      eventSource.addEventListener('done', (e) => {
        console.log('[DONE] 스트리밍 완료');
        eventSource.close();
      });

      eventSource.onerror = (e) => {
        console.error('[EventSource Error]', e);
        if (eventSource.readyState === EventSource.CLOSED) {
          console.log('EventSource 연결 종료');
        } else {
          showError({code:'STREAM_ERROR', message:'스트리밍 연결 오류'});
        }
        eventSource.close();
      };

    } catch(e){
      console.error('[Exception]', e);
      showError({code:'NETWORK', message:'네트워크 오류', details:{why:String(e)}});
    }
  }

  // ==== 초기화 ====
  (function init() {
    console.log('리포트 뷰 초기화');

    // 슬롯머신 로딩 애니메이션 시작
    startSlotAnimation();

    // 다운로드 버튼 이벤트 바인딩
    const dlBtn = $("dlBtn");
    if (dlBtn) dlBtn.onclick = downloadHTML;

    // 쿼리 파라미터 확인 후 자동 스트리밍 시작
    const params = getQueryParams();
    console.log('쿼리 파라미터:', params);

    if (params.session_id) {
      console.log('자동 스트리밍 시작...');
      startStreaming();
    } else {
      console.log('session_id가 없어 부모 창으로부터 데이터 전달 대기 중...');
    }
  })();
  </script>
</body>
</html>
