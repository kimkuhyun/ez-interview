<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>면접 리포트</title>
  <style>{% include 'css/report.css' %}</style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <div>
        <h1 id="reportTitle">면접 리포트</h1>
        <p>AI 기반 면접 평가 및 분석 결과</p>
      </div>
      <div class="header-actions">
        <span id="genStatus" class="pill" style="display:none;">생성중…</span>
        <button id="genBtn" class="btn btn-primary no-print">리포트 생성</button>
        <button id="newWindowBtn" type="button" class="btn btn-secondary no-print" style="display:none;">새 창에서 열기</button>
        <button id="dlBtn" class="btn btn-success no-print" style="display:none;">HTML 다운로드</button>
      </div>
    </div>
    <div class="header-line"></div>

    <!-- 실패 배너 -->
    <div id="errBox" class="alert alert-error" style="display:none;"></div>

    <!-- 본문(초기에는 안내만 보임) -->
    <div id="emptyBox" class="empty"><p>리포트를 생성하려면 “리포트 생성”을 클릭하세요.</p></div>

    <div id="reportRoot" style="display:none;">
      <!-- 헤드라인 -->
      <div class="headline">
        <div id="headlineSummary" class="headline-summary"></div>
        <div id="headlineKeywords" class="headline-keywords"></div>
      </div>

      <!-- 차트 + 인터뷰 요약 -->
      <div class="grid-2">
        <div class="card card-indigo card-highlight">
          <div class="card-header">📊 핵심 평가</div>
          <div class="chart-container"><canvas id="radarChart"></canvas></div>
        </div>
        <div class="card card-emerald card-highlight">
          <div class="card-header">💬 인터뷰 요약</div>
          <div id="flowList" class="summary-scroll"></div>
        </div>
      </div>

      <!-- 긍/부정 의견 -->
      <div class="grid-2">
        <div class="card" style="border-color:#22d3ee">
          <div class="card-header">✅ 긍정 의견</div>
          <div id="posBox" class="prose"></div>
        </div>
        <div class="card" style="border-color:#fb7185">
          <div class="card-header">⚠️ 부정 의견</div>
          <div id="negBox" class="prose"></div>
        </div>
      </div>

      <!-- 핵심역량 -->
      <div class="card">
        <div class="card-header" style="color:#7c3aed;">📋 핵심역량</div>
        <div style="overflow-x:auto;">
          <table id="jdTable">
            <thead><tr><th>역량</th><th>요구사항 / 기대치</th><th>점수</th><th>근거</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 증거 맵 -->
      <div class="card">
        <div class="card-header" style="color:#d97706;">🔍 증거 맵</div>
        <div style="overflow-x:auto;">
          <table id="evTable">
            <thead><tr><th>EID</th><th>출처</th><th>내용</th><th>연결 JD</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 대화 통계 -->
      <div class="card">
        <div class="card-header" style="color:#0891b2;">📈 대화 통계</div>
        <div id="stats" class="stats"></div>
      </div>
    </div>
  </div>

  <script>
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

  // 전역 리포트 데이터
  let currentReportData = null;

  // ==== 새 창 복제 열기(Blob URL 방식) ====
  function openInNewWindow(){
    if (!currentReportData) {
      alert('리포트 데이터가 없습니다. 먼저 리포트를 생성하세요.');
      return;
    }

    // 1) HTML 복제 및 정리
    const htmlDoc = document.documentElement.cloneNode(true);
    const emptyBox = htmlDoc.querySelector('#emptyBox');
    if (emptyBox) emptyBox.style.display='none';
    const reportRoot = htmlDoc.querySelector('#reportRoot');
    if (reportRoot) reportRoot.style.display='block';
    const genBtn = htmlDoc.querySelector('#genBtn');
    if (genBtn) genBtn.style.display='none';
    const newBtn = htmlDoc.querySelector('#newWindowBtn');
    if (newBtn) newBtn.style.display='none';
    const dlBtn = htmlDoc.querySelector('#dlBtn');
    if (dlBtn) dlBtn.style.display='inline-block';

    // 2) 리포트 데이터 주입 스크립트
    const reportDataBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentReportData))));
    const injector = document.createElement('script');
    injector.textContent = `
      (function(){
        const block=(u)=> typeof u==='string' && /^\\/(api|reports)\\//.test(u);
        const of=window.fetch?window.fetch.bind(window):null;
        if(of) window.fetch=(u,o)=> block(u)?Promise.reject(new Error('API disabled')):of(u,o);
        if(window.XMLHttpRequest){
          const ox=XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open=function(m,u){
            if(block(u)) throw new Error('API disabled');
            return ox.apply(this,arguments);
          };
        }
      })();
      (function wait(){
        if(!(window.Chart && typeof renderReport==='function'))
          return setTimeout(wait,30);
        const data = JSON.parse(decodeURIComponent(escape(atob('${reportDataBase64}'))));
        window.currentReportData = data;
        const t=document.getElementById('reportTitle');
        if(t && data?.candidate_name)
          t.textContent = data.candidate_name+'의 면접 리포트';
        renderReport(data);
      })();`;
    htmlDoc.body.appendChild(injector);

    // 3) Blob URL 생성 및 새 창 열기
    const htmlStr = '<!DOCTYPE html>\n' + htmlDoc.outerHTML;
    const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
    const blobUrl = URL.createObjectURL(blob);

    // 4) 사용자 제스처와 직접 연결된 window.open 호출
    const w = window.open(blobUrl, '_blank', 'width=1200,height=800');
    if (!w) {
      alert('팝업이 차단되었습니다. 브라우저 설정에서 팝업을 허용하세요.');
      URL.revokeObjectURL(blobUrl);
      return;
    }

    // 5) Blob URL 정리 (새 창이 로드된 후)
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
  }



  // ==== HTML 다운로드 ====
  function downloadHTML() {
    const htmlDoc = document.documentElement.cloneNode(true);

    // 상태 및 버튼 영역 정리
    const headerActions = htmlDoc.querySelector('.header-actions');
    if (headerActions) headerActions.remove();
    const errBox = htmlDoc.querySelector('#errBox');
    if (errBox) errBox.remove();
    const emptyBox = htmlDoc.querySelector('#emptyBox');
    if (emptyBox) emptyBox.remove();

    const htmlStr = '<!DOCTYPE html>\n' + htmlDoc.outerHTML;
    const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `interview_report_${new Date().toISOString().slice(0,10)}.html`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  // ==== 리포트 생성(원 페이지에서만 사용) ====
  async function generateReport() {
    const btn = $("genBtn"), pill = $("genStatus"), err = $("errBox");
    err.style.display="none"; err.textContent="";
    pill.style.display="inline-block"; btn.disabled=true; btn.textContent="생성중…";

    const payload = new URLSearchParams();

    // 1) 상태 조회
    let sessionId = null, axesKeys = null, resumeId = null, jdId = null;
    try {
      const stateRes = await fetch('/api/state', { method: 'GET' });
      if (stateRes.ok) {
        const stateData = await stateRes.json();
        const st = stateData.state || stateData;
        sessionId = st.session_id;
        resumeId = st.resume_id;
        jdId = st.jd_id;
        if (st.metrics && st.metrics.length > 0) axesKeys = st.metrics.join(',');
      }
    } catch(e){ console.warn('state 조회 실패:', e); }

    if (sessionId) payload.set('session_id', sessionId);
    if (axesKeys) payload.set('axes_keys', axesKeys);

    try {
      const res = await fetch('/reports/generate', {
        method:'POST',
        headers:{
          'Content-Type':'application/x-www-form-urlencoded',
          'Accept':'application/json'
        },
        body:payload
      });
      const j = await res.json();

      if (j.status === 'failed') { showError(j); return; }

      currentReportData = j;
      renderReport(j);

      $("genBtn").style.display = "none";
      $("newWindowBtn").style.display = "inline-block";
      $("dlBtn").style.display = "inline-block";
    } catch(e){
      showError({code:'NETWORK', message:'네트워크 오류', details:{why:String(e)}});
    } finally {
      pill.style.display="none"; btn.disabled=false; btn.textContent="리포트 생성";
    }
  }

  function showError(err){
    const box=$("errBox");
    box.innerHTML =
      `<div class="alert-title">리포트 생성 실패</div>
       <div class="alert-body"><span class="code">${esc(err.code||'ERROR')}</span> ${esc(err.message||'오류')}</div>
       ${err.details?`<details class="alert-details"><summary>진단 정보</summary><pre>${esc(JSON.stringify(err.details,null,2))}</pre></details>`:''}
       ${err.trace_id?`<div class="alert-trace">trace_id: <code>${esc(err.trace_id)}</code></div>`:''}`;
    box.style.display="block";
  }

  function normalizeFulfill(v){
    const s = String(v||'').trim().toLowerCase().replace(/\s+/g,'');
    if (/^(충족|만족|ok|pass|full)$/.test(s)) return 'full';
    if (/^(부분|부분충족|부분만족|partial)$/.test(s)) return 'partial';
    return 'none';
  }

  // ==== 렌더러 ====
  let radar;
  function renderReport(r){
    $("emptyBox").style.display="none";
    $("reportRoot").style.display="block";
    $("dlBtn").style.display="inline-block";

    const candidateName = r?.candidate_name || "지원자";
    $("reportTitle").textContent = `${candidateName}의 면접 리포트`;

    $("headlineSummary").textContent = r?.headline?.summary || "";
    const keywords = (r?.headline?.tag || '').split(',').map(k => k.trim()).filter(Boolean);
    $("headlineKeywords").innerHTML = keywords.map(kw =>
      `<span class="headline-keyword">#${esc(kw)}</span>`
    ).join('');

    const labels = (r.axes||[]).map(a=>a.label||a.key);
    const keys   = (r.axes||[]).map(a=>a.key);

    let scoresObj = {};
    if (Array.isArray(r.scores)) r.scores.forEach(s => { scoresObj[s.key] = s.value; });
    else scoresObj = r.scores || {};

    const values = keys.map(k => (typeof scoresObj[k]==="number") ? scoresObj[k] : 0);

    if (radar) radar.destroy();
    radar = new Chart($("radarChart"), {
      type:'radar',
      data:{ labels, datasets:[{ label:'점수', data:values, fill:true,
        backgroundColor:'rgba(99,102,241,0.2)', borderColor:'rgb(79,70,229)', borderWidth:2,
        pointBackgroundColor:'rgb(79,70,229)', pointBorderColor:'#fff', pointBorderWidth:2, pointRadius:4 }] },
      options:{ responsive:true, maintainAspectRatio:true,
        scales:{ r:{ beginAtZero:true, min:0, max:100, ticks:{ stepSize:20 } } },
        plugins:{ legend:{ display:false } } }
    });

    const items = (r.talkSummary && r.talkSummary.items) ? r.talkSummary.items : [];
    const overall = items.find(x=>x.주제==='인터뷰 요약');
    const pos = items.find(x=>x.주제==='긍정 의견');
    const neg = items.find(x=>x.주제==='부정 의견');
    const flows = items.filter(x=>x.주제!=='인터뷰 요약' && x.주제!=='긍정 의견' && x.주제!=='부정 의견');

    let flowHTML = '';
    if (overall && overall.발언요약) {
      flowHTML += `
        <div class="qa-simple" style="border-left:3px solid #10b981;background:#f0fdf4;">
          <div class="qa-topic" style="font-weight:600;color:#059669;">전체 요약</div>
          <div class="qa-summary">${esc(overall.발언요약)}</div>
        </div>`;
    }
    flowHTML += flows.map(it=>{
      const topic = it.주제 || '';
      const content = it.발언요약 || '';
      return `
        <div class="qa-simple">
          <div class="qa-topic">${esc(topic)}</div>
          <div class="qa-summary">${esc(content)}</div>
        </div>`;
    }).join("");
    if (!flowHTML) flowHTML = '<div class="empty"><p>인터뷰 요약이 없습니다</p></div>';
    $("flowList").innerHTML = flowHTML;

    $("posBox").innerHTML = pos ? `<p>${esc(pos.발언요약||'')}</p>` : '<div class="empty"><p>없음</p></div>';
    $("negBox").innerHTML = neg ? `<p>${esc(neg.발언요약||'')}</p>` : '<div class="empty"><p>없음</p></div>';

    const jdBody = document.querySelector("#jdTable tbody");
    const axesMap = {};
    (r.axes||[]).forEach((ax, idx) => { axesMap[`C${String(idx+1).padStart(2,'0')}`] = ax; });

    const competencyNames = {
      "problem_solving": "문제해결능력",
      "communication": "커뮤니케이션",
      "self_driven_initiative": "자기주도성",
      "collaboration": "협업능력",
      "professional_expertise": "전문성"
    };

    jdBody.innerHTML = (r.jdCoverage||[]).map(row=>{
      const chips = (row.근거||[]).map(e =>
        `<span class="badge badge-indigo eid-link" data-eid="${esc(e)}" onclick="scrollToEvidence('${esc(e)}')">${esc(e)}</span>`
      ).join(" ");

      const axInfo = axesMap[row.jid];
      let score = 0, competencyName = row.jid;
      if (axInfo && scoresObj[axInfo.key] !== undefined) {
        score = scoresObj[axInfo.key];
        competencyName = competencyNames[axInfo.key] || axInfo.label || axInfo.key;
      }

      const expect = String(row.기대치 || '').replace(/^\s*(기준[:\s-]*)?/,'').trim();
      const fulfillBadge = `<div class="fulfillment-badge"><span class="fulfillment-score">${score}점</span></div>`;

      return `<tr>
        <td><strong style="color:#7c3aed;">${esc(competencyName)}</strong></td>
        <td>${esc(row.요구사항)}<div class="jd-expectation">기준: ${esc(expect)}</div></td>
        <td>${fulfillBadge}</td>
        <td>${chips||'<span style="color:#9ca3af;">-</span>'}</td>
      </tr>`;
    }).join("");

    const evBody = document.querySelector("#evTable tbody");
    evBody.innerHTML = (r.evidence||[]).map(ev=>{
      const axInfo = axesMap[ev.jid];
      let competencyName = ev.jid;
      if (axInfo) competencyName = competencyNames[axInfo.key] || axInfo.label || axInfo.key;

      return `<tr id="ev-${esc(ev.eid)}" class="evidence-row">
        <td><strong style="color:#4f46e5;">${esc(ev.eid)}</strong></td>
        <td style="color:#6b7280;font-size:0.75rem;">${esc(ev.출처)}</td>
        <td>${esc(ev.내용)}</td>
        <td><span class="badge badge-purple">${esc(competencyName)}</span></td>
      </tr>`;
    }).join("");

    $("stats").innerHTML = (r.convStats||[]).map(kv =>
      `<div class="stats-item"><span class="stats-label">${esc(kv.k)}</span><span>:</span><span class="stats-value">${esc(kv.v)}</span></div>`
    ).join("");
  }

  // 서버가 초기 렌더 시 report 데이터를 넣어준 경우만 처리
  {% if report and report.axes %}
  window.addEventListener('DOMContentLoaded', function() {
    try {
      const data = {{ report|tojson|safe }};
      if (data && data.status === 'failed') showError(data);
      else renderReport(data);
    } catch (e) { console.error('초기 렌더링 실패:', e); }
  });
  {% endif %}

  // EID 클릭 시 증거 맵 하이라이트
  function scrollToEvidence(eid) {
    const targetRow = document.getElementById(`ev-${eid}`);
    if (!targetRow) return;
    document.querySelectorAll('.evidence-row').forEach(row => row.classList.remove('evidence-highlight'));
    targetRow.scrollIntoView({ behavior:'smooth', block:'center' });
    setTimeout(() => {
      targetRow.classList.add('evidence-highlight');
      setTimeout(() => targetRow.classList.remove('evidence-highlight'), 3000);
    }, 500);
  }

  // ==== 초기화: 버튼 이벤트 바인딩 ====
  (function initButtons() {
    console.log('=== 버튼 초기화 시작 ===');

    const genBtn = $("genBtn");
    console.log('genBtn:', genBtn);
    if (genBtn) {
      genBtn.onclick = function(e) {
        console.log('리포트 생성 버튼 클릭됨');
        generateReport();
      };
      console.log('리포트 생성 버튼 바인딩 완료');
    }

    const newWindowBtn = $("newWindowBtn");
    console.log('newWindowBtn:', newWindowBtn);
    if (newWindowBtn) {
      newWindowBtn.onclick = function(e) {
        console.log('새 창 버튼 클릭됨');
        console.log('currentReportData:', currentReportData);
        openInNewWindow();
      };
      console.log('새 창 버튼 바인딩 완료');
    }

    const dlBtn = $("dlBtn");
    console.log('dlBtn:', dlBtn);
    if (dlBtn) {
      dlBtn.onclick = function(e) {
        console.log('다운로드 버튼 클릭됨');
        downloadHTML();
      };
      console.log('다운로드 버튼 바인딩 완료');
    }

    console.log('=== 버튼 초기화 완료 ===');
  })();
  </script>
</body>
</html>
