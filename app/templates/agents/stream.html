<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <style>
    {% include 'css/stream.css' %}
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="stt-bar">
      <div class="stt-indicator" id="stt-indicator"></div>
      <button id="stt-btn" onclick="toggleSTT()">STT 시작</button>
    </div>
    <div id="tab-bar" class="tab-bar"></div>
    <div id="chat-area" style="flex:1; overflow-y:auto;"></div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="메시지를 입력하세요..."
        onkeypress="if(event.key==='Enter'){ sendMessage(); }">
      <button id="send-btn" onclick="sendMessage()">전송</button>
    </div>
  </div>

  <script>{% include 'js/stream.js' %}</script>
</body>

</html>
