<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    h2, p {
      margin: 0 0 10px 0;
    }

    .header {
      flex-shrink: 0;
      margin-bottom: 15px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      flex: 1;
      overflow: hidden;
    }

    .section-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .section-header {
      padding: 12px 15px;
      background: #f8f9fa;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
      font-weight: bold;
      color: #333;
    }

    .section-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      padding-right: 8px;
    }

    /* 스크롤바 스타일 */
    .section-content::-webkit-scrollbar {
      width: 8px;
    }

    .section-content::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }

    .section-content::-webkit-scrollbar-thumb {
      background: #bbb;
      border-radius: 4px;
    }

    .section-content::-webkit-scrollbar-thumb:hover {
      background: #888;
    }

    #questionList { 
      margin-top: 0;
      display: contents;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error-message {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      flex-shrink: 0;
    }
    
    .success-message {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      flex-shrink: 0;
    }

    .question-item {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fafafa;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
    }

    .question-item.fixed {
      background: #fff3cd;
      border-color: #ffc107;
    }

    .question-item.fixed::before {
<!--      content: '📌 ';-->
      font-weight: bold;
<!--      color: #ffc107;-->
      margin-right: 5px;
    }
    
    .question-text {
      flex: 1;
      word-wrap: break-word;
      word-break: break-all;
    }

    .question-text input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #3498db;
      border-radius: 4px;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }
    
    .question-number {
      font-weight: bold;
      color: #3498db;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .question-actions {
      display: flex;
      gap: 5px;
      margin-left: 10px;
      flex-shrink: 0;
    }

    .question-actions button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .edit-btn {
      background: #3498db;
      color: white;
    }

    .edit-btn:hover {
      background: #2980b9;
    }

    .save-question-btn {
      background: #27ae60;
      color: white;
    }

    .save-question-btn:hover {
      background: #229954;
    }

    .cancel-btn {
      background: #95a5a6;
      color: white;
    }

    .cancel-btn:hover {
      background: #7f8c8d;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .add-question-btn {
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      margin-top: 12px;
      margin-bottom: 10px;
      font-weight: bold;
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .add-question-btn:hover {
      background: #229954;
    }

    .metric-list {
      background: #f9f9f9;
      padding: 0;
      border-radius: 0;
      margin: 0;
    }

    .metric-list h3 {
      display: none;
    }

    .metric-list label { 
      display: block; 
      padding: 10px 12px;
      margin: 0;
      cursor: pointer;
      border-bottom: 1px solid #efefef;
    }
    
    .metric-list label:last-child {
      border-bottom: none;
    }
    
    .metric-list input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }

    .save-btn {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      margin: 12px 12px 0 12px;
      font-weight: bold;
      transition: background 0.3s;
      width: calc(100% - 24px);
      flex-shrink: 0;
    }
    
    .save-btn:hover {
      background: #0056b3;
    }
    
    .save-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }

    .debug-info {
      background: #e7f3ff;
      border: 1px solid #b3d9ff;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #004085;
      margin-top: 15px;
    }

    .metric-wrapper {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .metric-count {
      text-align: center;
      padding: 8px 12px;
      background: #f0f0f0;
      font-weight: bold;
      color: #333;
      border-top: 1px solid #ddd;
    }

    /* 면접 진행 버튼 */
    .interview-start-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .interview-start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .interview-start-btn:active {
      transform: translateY(0);
    }

  </style>
</head>
<body>
  <div class="header">
    <h2> AI 기반 질문 생성</h2>
    <p>AI가 생성한 질문과 평가지표를 검토하세요.</p>
    <div id="messageContainer"></div>
  </div>

  <div class="container">
    <!-- 질문 섹션 -->
    <div class="section-wrapper">
      <div class="section-header">📋 면접 질문 (자동 생성 + 수정 가능)</div>
      <div class="section-content" id="questionSection">
        <div class="loading-spinner"></div> 질문 생성 중...
      </div>
    </div>

    <!-- 평가지표 섹션 -->
    <div class="section-wrapper">
      <div class="section-header">📊 생성된 평가지표 (최대 5개 선택)</div>
      <div class="section-content" id="metricSection">
        <div class="loading-spinner"></div> 평가지표 로드 중...
      </div>
    </div>
  </div>

  <!-- 면접 진행 버튼 -->
  <button class="interview-start-btn" onclick="startInterview()">🎤 면접 진행</button>

  <script>
    let questions = [];
    let metrics = [];
    let selectedMetrics = [];
    let editingIndex = -1;

    // 고정된 질문들 (첫 번째, 마지막)
    const FIXED_QUESTIONS = {
      first: "자신에 대해 간단히 소개해 주세요.",
      last: "마지막으로 저희 회사에 하고 싶은 말씀이 있으신가요?"
    };

    // ✅ 페이지 로드 시 자동으로 질문 생성
    console.log("💡 question.html 로드됨 - 자동으로 질문 생성 시작...");
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', generateQuestions);
    } else {
      generateQuestions();
    }

    async function generateQuestions() {
      const messageContainer = document.getElementById("messageContainer");
      const questionSection = document.getElementById("questionSection");
      
      if (questions.length > 0) {
        console.log("💡 이미 질문이 생성되었습니다");
        return;
      }
      
      try {
        console.log("📡 API 호출 시작: /api/interview-question");
        messageContainer.innerHTML = "";
        questionSection.innerHTML = '<div class="loading-spinner"></div> 질문 생성 중...';

        // 먼저 GLOBAL_STATE에서 session_id 가져오기
        console.log("🔍 현재 State 조회 중...");
        const stateRes = await fetch("/api/state", {
          method: "GET",
          headers: { "Content-Type": "application/json" }
        });
        
        if (!stateRes.ok) {
          throw new Error("현재 State를 조회할 수 없습니다. 먼저 문서를 임베딩해주세요.");
        }
        
        const stateData = await stateRes.json();
        const sessionId = stateData.session_id;
        console.log("✅ Session ID 획득:", sessionId);

        const requestBody = {
          query_text: "지원자 이력서 및 JD를 기반으로 면접 질문과 평가지표를 생성해라.",
          num_questions: 8,  // 고정 2개를 제외한 8개만 생성
          session_id: sessionId  // ✅ session_id 포함
        };
        
        console.log("   - 요청 내용:", requestBody);

        const res = await fetch("/api/interview-question", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });

        console.log("📥 응답 상태:", res.status, res.statusText);

        if (!res.ok) {
          const errorData = await res.json();
          console.error("   - 에러 응답:", errorData);
          throw new Error(`HTTP Error: ${res.status} ${res.statusText} - ${errorData.error || 'Unknown error'}`);
        }

        const data = await res.json();
        console.log("✅ API 응답 데이터:", data);

        if (!data.questions) {
          throw new Error("응답에 questions 필드가 없습니다");
        }
        if (!data.metrics) {
          throw new Error("응답에 metrics 필드가 없습니다");
        }

        // 고정 질문 추가: [자기소개, 생성된 질문들..., 마지막 말]
<!--        questions = [FIXED_QUESTIONS.first, ...data.questions, FIXED_QUESTIONS.last];-->
        questions = data.questions;
        metrics = data.metrics;

        console.log(`📊 생성된 질문: ${questions.length}개 (고정 2개 포함), 지표: ${metrics.length}개`);

        renderQuestions();
        renderMetrics();

      } catch (error) {
        console.error("❌ 에러 발생:", error);
        console.error("   - 전체 스택:", error.stack);
        messageContainer.innerHTML = `
          <div class="error-message">
            <strong>❌ 오류 발생:</strong> ${error.message}<br>
            <small>개발자 콘솔 (F12)을 확인하세요.</small>
          </div>
        `;
        questionSection.innerHTML = "";
      }
    }

    function renderQuestions() {
      const section = document.getElementById("questionSection");
      section.innerHTML = "";
      
      if (questions.length === 0) {
        section.innerHTML = "<p style='color: #666;'>생성된 질문이 없습니다.</p>";
        return;
      }

      const wrapper = document.createElement("div");
      wrapper.id = "questionList";
      
      questions.forEach((q, i) => {
        const isFirst = i === 0;
        const isLast = i === questions.length - 1;
        const isFixed = isFirst || isLast;

        const item = document.createElement("div");
        item.className = `question-item ${isFixed ? 'fixed' : ''}`;
        item.id = `question-${i}`;
        
        if (editingIndex === i) {
          // 수정 모드
          item.innerHTML = `
            <div class="question-text">
              <span class="question-number">Q${i + 1}.</span>
              <input type="text" id="edit-input-${i}" value="${escapeHtml(q)}" autofocus>
            </div>
            <div class="question-actions">
              <button class="save-question-btn" onclick="saveEditQuestion(${i})">저장</button>
              <button class="cancel-btn" onclick="cancelEdit()">취소</button>
            </div>
          `;
        } else {
          // 일반 모드
          item.innerHTML = `
            <div class="question-text">
              <span class="question-number">Q${i + 1}.</span>
              <span>${q}</span>
            </div>
            <div class="question-actions">
              <button class="edit-btn" onclick="startEdit(${i})">수정</button>
              ${!isFixed ? `<button class="delete-btn" onclick="deleteQuestion(${i})">삭제</button>` : ''}
            </div>
          `;
        }
        wrapper.appendChild(item);
      });

      // 질문 추가 버튼
      const addBtn = document.createElement("button");
      addBtn.className = "add-question-btn";
      addBtn.textContent = "➕ 질문 추가";
      addBtn.onclick = addNewQuestion;
      wrapper.appendChild(addBtn);
      
      section.appendChild(wrapper);
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function startEdit(index) {
      editingIndex = index;
      renderQuestions();
      
      // 포커스 설정
      setTimeout(() => {
        const input = document.getElementById(`edit-input-${index}`);
        if (input) input.focus();
      }, 0);
    }

    function saveEditQuestion(index) {
      const input = document.getElementById(`edit-input-${index}`);
      const newText = input.value.trim();
      
      if (!newText) {
        alert("질문을 입력해주세요.");
        return;
      }
      
      questions[index] = newText;
      editingIndex = -1;
      renderQuestions();
      console.log(`✏️ 질문 ${index + 1} 수정 완료:`, newText);
    }

    function cancelEdit() {
      editingIndex = -1;
      renderQuestions();
    }

    function deleteQuestion(index) {
      if (confirm(`Q${index + 1} 질문을 삭제하시겠습니까?`)) {
        questions.splice(index, 1);
        renderQuestions();
        console.log(`🗑️ 질문 ${index + 1} 삭제 완료`);
      }
    }

    function addNewQuestion() {
      const newQuestion = prompt("새로운 질문을 입력하세요:");
      if (newQuestion && newQuestion.trim()) {
        // 마지막 질문 앞(즉, 인덱스 length-1에 삽입)
        questions.splice(questions.length - 1, 0, newQuestion.trim());
        renderQuestions();
        console.log(`➕ 새 질문 추가:`, newQuestion);
      }
    }

    function renderMetrics() {
      const metricSection = document.getElementById("metricSection");
      metricSection.innerHTML = "";

      if (metrics.length === 0) {
        metricSection.innerHTML = "<p style='color: #666;'>생성된 평가지표가 없습니다.</p>";
        return;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "metric-list";
      
      metrics.forEach(m => {
        const label = document.createElement("label");
        label.innerHTML = `
          <input type="checkbox" value="${escapeHtml(m)}" onchange="toggleMetric(this)"> 
          <span>${m}</span>`;
        wrapper.appendChild(label);
      });

      metricSection.appendChild(wrapper);

      // 선택 카운터만 표시 (저장 버튼 제거)
      const footer = document.createElement("div");
      footer.className = "metric-wrapper";
      
      const countDiv = document.createElement("div");
      countDiv.className = "metric-count";
      countDiv.id = "metricCount";
      countDiv.textContent = `0 / 5 선택`;
      footer.appendChild(countDiv);
      
      metricSection.appendChild(footer);
    }

    function toggleMetric(checkbox) {
      const metric = checkbox.value;
      
      if (checkbox.checked) {
        if (selectedMetrics.length >= 5) {
          alert("최대 5개까지만 선택 가능합니다.");
          checkbox.checked = false;
          return;
        }
        selectedMetrics.push(metric);
      } else {
        selectedMetrics = selectedMetrics.filter(m => m !== metric);
      }
      
      // 카운터 업데이트
      const countDiv = document.getElementById("metricCount");
      if (countDiv) {
        countDiv.textContent = `${selectedMetrics.length} / 5 선택`;
      }
      
      console.log("✏️ 선택된 지표:", selectedMetrics);
    }

    // 면접 진행 버튼
    async function startInterview() {
      console.log("🎤 면접 진행 버튼 클릭");
      
      // 검증: 평가지표 5개 선택 확인
      if (selectedMetrics.length !== 5) {
        alert(`❌ 평가지표를 정확히 5개 선택해주세요 (현재: ${selectedMetrics.length}개)`);
        return;
      }
      
      console.log("✅ 선택된 평가지표 검증 완료: 5개");
      
      // 현재 UI의 질문과 선택된 지표를 State에 저장
      try {
        console.log("💾 면접 진행 전 최종 State 저장");
        console.log("   - 질문: " + questions.length + "개");
        console.log("   - 선택된 지표: " + selectedMetrics.length + "개");
        
        const res = await fetch("/api/state", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            questions: questions,           // UI에서 수정된 질문들
            selected_metrics: selectedMetrics // 사용자가 선택한 지표 (5개)
          })
        });
        
        if (!res.ok) {
          const errorData = await res.json();
          throw new Error(errorData.message || "State 저장 실패");
        }
        
        const data = await res.json();
        console.log("✅ 최종 State 저장 완료", data);
        
        // 왼쪽 패널의 임베딩/질문 생성 버튼 숨기기
        const embedBtn = document.getElementById("embedBtn");
        const questionBtn = document.getElementById("questionBtn");
        if (embedBtn) embedBtn.style.display = "none";
        if (questionBtn) questionBtn.style.display = "none";
        console.log("🙈 임베딩/질문 생성 버튼 숨김");
        
        document.getElementById("messageContainer").innerHTML = `
          <div class="success-message">
            ✅ 준비 완료! 면접을 시작합니다.<br>
            <small>질문: ${questions.length}개 | 평가지표: ${selectedMetrics.length}개</small>
          </div>
        `;
        
        // State 저장 후 Stream 패널 로드
        setTimeout(() => loadPanel('stream'), 500);
        
      } catch (error) {
        console.error("❌ State 저장 실패:", error);
        alert("❌ 면접 진행 실패: " + error.message);
      }
    }
  </script>
</body>
</html>
