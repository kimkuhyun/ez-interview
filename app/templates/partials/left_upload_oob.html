<div id="leftUpload" hx-swap-oob="outerHTML" class="mb-6 p-4 bg-white rounded shadow space-y-3">
  {% from "partials/_macros.html" import panel %}

  {% call panel("문서 업로드") %}
    <!-- 하나의 폼에서 여러 파일 -->
    <form id="multiForm"
          hx-post="/rag/pipeline"
          hx-target="#right" hx-swap="innerHTML"
          enctype="multipart/form-data"
          class="flex gap-2 w-full">
      <input id="multiInput" type="file" name="files" multiple
             accept=".pdf,.docx,.txt"
             class="border rounded px-3 py-2 flex-1" />
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
        파일 불러오기
      </button>
    </form>

    <!-- 선택 파일 칩 + X 삭제 -->
    <div id="fileChips" class="flex flex-wrap gap-2 text-sm"></div>

    <p class="text-xs text-gray-500">첫 번째 파일=이력서, 두 번째=공고(JD). 필요시 서버에서 매핑 변경.</p>

    <script>
      (function () {
        const input = document.getElementById('multiInput');
        const chips = document.getElementById('fileChips');

        function rebuildChips(files){
          chips.innerHTML = '';
          Array.from(files).forEach((f, idx) => {
            const tag = document.createElement('span');
            tag.className = 'px-2 py-1 bg-gray-100 rounded border inline-flex items-center gap-2';
            tag.innerHTML = `<span class="truncate max-w-xs" title="${f.name}">${f.name}</span>
                             <button type="button" data-i="${idx}" class="px-1 text-gray-600">✕</button>`;
            chips.appendChild(tag);
          });
        }

        function removeAt(i){
          const dt = new DataTransfer();
          Array.from(input.files).forEach((f, idx) => { if(idx !== i) dt.items.add(f); });
          input.files = dt.files;
          rebuildChips(input.files);
        }

        input.addEventListener('change', () => rebuildChips(input.files));
        chips.addEventListener('click', (e) => {
          const b = e.target.closest('button[data-i]');
          if (!b) return;
          removeAt(parseInt(b.getAttribute('data-i')));
        });
      })();
    </script>
  {% endcall %}
</div>
