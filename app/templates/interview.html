<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Interview Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
        }
        #left-panel {
            width: 50%;
            background: #fafafa;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #right-panel {
            width: 50%;
            padding: 30px;
            overflow-y: auto;
        }
        iframe {
            width: 90%;
            height: 300px;
            border: 1px solid #aaa;
            margin-top: 10px;
        }
        .upload-block {
            width: 90%;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 15px;
            margin-bottom: 15px;
        }
        .upload-label {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            margin-top: 5px;
        }
        input[type="file"] { display: none; }
        #analyzeBtn {
            background: #28a745;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }
        nav {
            position: fixed;
            top: 10px;
            right: 10px;
        }
        nav button {
            margin-left: 5px;
            padding: 6px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="left-panel">
    <div class="upload-block">
        <h3>📄 본인 커리어 문서</h3>
        <p>이력서 / 자기소개서 등 본인의 경험을 설명하는 문서를 업로드하세요.</p>
        <label class="upload-label" for="careerFile">업로드</label>
        <input type="file" id="careerFile" accept=".pdf,.docx,.txt">
        <iframe id="careerPreview"></iframe>
    </div>

    <div class="upload-block">
        <h3>🏢 지원 직무 문서</h3>
        <p>지원하는 회사 또는 직무(JD 등)에 관한 문서를 업로드하세요.</p>
        <label class="upload-label" for="jobFile">업로드</label>
        <input type="file" id="jobFile" accept=".pdf,.docx,.txt">
        <iframe id="jobPreview"></iframe>
    </div>

    <button id="analyzeBtn" onclick="startAnalysis()">🚀 AI 기반 분석 시작</button>
</div>

<div id="right-panel">
    <h2>🧠 오른쪽 패널</h2>
    <p>Agent별 템플릿이 여기에 로드됩니다.</p>
</div>

<nav>
    <button onclick="loadPanel('question')">Question Agent</button>
    <button onclick="loadPanel('stream')">Stream Agent</button>
    <button onclick="loadPanel('report')">Report Agent</button>
</nav>

<script>
    const careerInput = document.getElementById("careerFile");
    const jobInput = document.getElementById("jobFile");
    const careerPreview = document.getElementById("careerPreview");
    const jobPreview = document.getElementById("jobPreview");
    const rightPanel = document.getElementById("right-panel");

    // 파일 미리보기 (PDF만)
    function previewFile(input, viewer) {
        const file = input.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        viewer.src = url;
    }

    careerInput.addEventListener("change", () => previewFile(careerInput, careerPreview));
    jobInput.addEventListener("change", () => previewFile(jobInput, jobPreview));

    // 오른쪽 패널 로딩
    async function loadPanel(agent) {
        const res = await fetch(`/panel/${agent}`);
        const html = await res.text();
        rightPanel.innerHTML = html;


		// 삽입된 <script> 실행
		const scripts = rightPanel.querySelectorAll("script");
		for (const old of scripts) {
		const s = document.createElement("script");
		if (old.src) s.src = old.src; else s.textContent = old.textContent;
		document.body.appendChild(s);
		old.remove();
		}
    }

    // AI 분석 시작 → Question Agent 패널 로드 + 인터뷰 요청 실행
    async function startAnalysis() {
        await loadPanel('question');
        // 패널 로딩 후 question.html 내부의 generateQuestions()를 자동 실행
        setTimeout(() => {
            if (typeof generateQuestions === "function") {
                generateQuestions();
            }
        }, 500);
    }
</script>
</body>
</html>
